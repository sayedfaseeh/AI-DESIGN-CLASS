<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cindrebay AI Campus — Admin Terminal</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue: #B74094; --pink: #B74094; --pink-dark: #8f3175; --green: #16a34a; --red: #dc2626; --gray: #6b7280;
      --gray-light: #f3f4f6; --amber: #b45309; --amber-bg: #fef3c7;
    }
    * { box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; margin: 0; background: #f8fafc; color: #1f2937; }

    /* ---- Login gate ---- */
    #loginGate {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(160deg, #8f3175, #B74094);
    }
    #loginGate .card {
      background: white; border-radius: 14px; padding: 2rem; width: 90%; max-width: 360px;
    }
    #loginGate h1 { font-size: 1.2rem; margin: 0 0 1.25rem; }
    #loginGate input {
      width: 100%; border: 1.5px solid var(--gray-light); border-radius: 8px;
      padding: 0.7rem; font-size: 1rem; margin-bottom: 0.75rem;
    }
    #loginGate button {
      width: 100%; background: var(--blue); color: white; border: none; border-radius: 8px;
      padding: 0.75rem; font-weight: 600; cursor: pointer; font-size: 0.95rem;
    }
    #gateMsg { color: var(--red); font-size: 0.85rem; margin-top: 0.5rem; min-height: 1.2em; }

    /* ---- Main app ---- */
    #app { display: none; }
    header {
      background: var(--blue); color: white; padding: 1rem 1.5rem;
      display: flex; justify-content: space-between; align-items: center;
    }
    header h1 { font-size: 1.1rem; margin: 0; }
    header button {
      background: rgba(255,255,255,0.15); border: none; color: white;
      padding: 6px 14px; border-radius: 100px; cursor: pointer; font-size: 0.8rem;
    }
    main { max-width: 1000px; margin: 0 auto; padding: 1.5rem; }
    section { margin-bottom: 2rem; }
    section h2 { font-size: 1.05rem; margin: 0 0 0.75rem; }

    .card-list { display: grid; gap: 0.6rem; }
    .row-card {
      background: white; border-radius: 10px; padding: 0.9rem 1.1rem;
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
      box-shadow: 0 1px 3px rgb(0 0 0 / 0.05); flex-wrap: wrap;
    }
    .row-main { flex: 1; min-width: 200px; }
    .row-title { font-weight: 600; font-size: 0.95rem; }
    .row-sub { font-size: 0.8rem; color: var(--gray); margin-top: 2px; }
    .tag { font-size: 0.7rem; font-weight: 700; padding: 3px 9px; border-radius: 100px; text-transform: uppercase; }
    .tag.active { background: #dcfce7; color: var(--green); }
    .tag.inactive { background: var(--gray-light); color: var(--gray); }
    .tag.pending { background: var(--amber-bg); color: var(--amber); }
    .tag.approved { background: #dcfce7; color: var(--green); }
    .tag.iteration { background: #fee2e2; color: var(--red); }
    .row-actions { display: flex; gap: 0.5rem; align-items: center; }
    .btn {
      border: none; border-radius: 6px; padding: 6px 12px; font-size: 0.8rem;
      font-weight: 600; cursor: pointer;
    }
    .btn-primary { background: var(--blue); color: white; }
    .btn-green { background: var(--green); color: white; }
    .btn-red { background: var(--red); color: white; }
    .btn-ghost { background: var(--gray-light); color: #374151; }
    .xp-input {
      width: 55px; border: 1px solid var(--gray-light); border-radius: 6px;
      padding: 5px; font-size: 0.85rem; text-align: center;
    }
    .link-preview { font-size: 0.8rem; color: var(--pink); word-break: break-all; }
    .submission-thumb { max-width: 140px; max-height: 100px; border-radius: 6px; margin-top: 6px; display: block; border: 1px solid var(--gray-light); }
    .pdf-link { display: inline-block; margin-top: 6px; font-size: 0.85rem; color: var(--pink); text-decoration: none; font-weight: 600; }
    .pdf-link:hover { text-decoration: underline; }
    .empty { color: var(--gray); font-size: 0.9rem; text-align: center; padding: 1.5rem 0; }

    .add-student-form {
      background: white; border-radius: 10px; padding: 1rem; display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: flex-end;
    }
    .add-student-form .field {
      flex: 1; min-width: 140px; display: flex; flex-direction: column; gap: 4px;
    }
    .add-student-form .field.field-pin { flex: 0 0 110px; min-width: 110px; }
    .add-student-form label {
      font-size: 0.75rem; font-weight: 600; color: var(--gray); text-transform: uppercase; letter-spacing: 0.03em;
    }
    .add-student-form input {
      border: 1px solid var(--gray-light); border-radius: 6px; padding: 8px; font-size: 0.95rem;
    }
    .add-student-form input:focus {
      outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(29,78,216,0.12);
    }
    .add-student-form button { align-self: flex-end; height: 38px; }

    .timer-controls { display: flex; gap: 0.6rem; flex-wrap: wrap; }
    .timer-controls input {
      border: 1px solid var(--gray-light); border-radius: 6px; padding: 8px; font-size: 0.9rem; flex: 1; min-width: 140px;
    }
    .bulk-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  </style>
</head>
<body>

  <div id="loginGate">
    <div class="card">
      <h1>🔑 Teacher Login</h1>
      <input type="password" id="teacherKeyInput" placeholder="Teacher key">
      <button id="gateBtn">Enter Admin Terminal</button>
      <div id="gateMsg"></div>
    </div>
  </div>

  <div id="app">
    <header>
      <h1>Cindrebay AI Campus — Admin Terminal</h1>
      <button id="logoutBtn">Log out</button>
    </header>

    <main>
      <section>
        <h2>Recent Sign-Ups</h2>
        <div class="card-list" id="pendingRegList"><p class="empty">Loading…</p></div>
      </section>

      <section>
        <h2>Add Student</h2>
        <div class="add-student-form">
          <div class="field">
            <label for="newName">Full name</label>
            <input type="text" id="newName" placeholder="e.g. Rila Nafeesa">
          </div>
          <div class="field">
            <label for="newRole">Studio role</label>
            <input type="text" id="newRole" placeholder="e.g. Interior Designer">
          </div>
          <div class="field field-pin">
            <label for="newPin">4-digit PIN</label>
            <input type="text" id="newPin" placeholder="e.g. 7454" maxlength="4" inputmode="numeric" pattern="[0-9]*">
          </div>
          <button class="btn btn-primary" id="addStudentBtn">Add</button>
        </div>
        <div id="addStudentMsg" style="margin-top:0.5rem; font-size:0.85rem;"></div>
      </section>

      <section>
        <h2>Live Timer</h2>
        <div class="timer-controls">
          <input type="text" id="timerLabelInput" placeholder="e.g. Q1.3 NIGHT_AND_DAY">
          <input type="number" id="timerMinutesInput" placeholder="Minutes" min="1" style="max-width:100px;">
          <button class="btn btn-primary" id="startTimerBtn">Start</button>
          <button class="btn btn-red" id="stopTimerBtn">Stop</button>
        </div>
        <div id="timerStatus" style="margin-top:0.5rem; font-size:0.85rem; color:var(--gray);"></div>
      </section>

      <section>
        <h2>Quest Control</h2>
        <div class="bulk-actions">
          <button class="btn btn-primary" id="activateDay1Btn">Activate all Day 1 (Q1.x)</button>
          <button class="btn btn-primary" id="activateDay2Btn">Activate all Day 2 (Q2.x)</button>
          <button class="btn btn-ghost" id="deactivateAllBtn">Deactivate all</button>
        </div>
        <div class="card-list" id="questList" style="margin-top:0.75rem;"><p class="empty">Loading…</p></div>
      </section>

      <section>
        <h2>Pending Submissions</h2>
        <div class="card-list" id="pendingList"><p class="empty">Loading…</p></div>
      </section>

      <section>
        <h2>Students &amp; Quick XP</h2>
        <div style="display:flex; gap:0.5rem; margin-bottom:0.75rem; flex-wrap:wrap;">
          <input type="text" id="studentSearch" placeholder="Search by name, role, or PIN…" style="flex:1; min-width:200px; border:1px solid var(--gray-light); border-radius:8px; padding:10px 12px; font-size:0.9rem; box-sizing:border-box;">
          <button class="btn btn-ghost" id="exportCsvBtn">Export CSV</button>
        </div>
        <div class="card-list" id="studentList"><p class="empty">Loading…</p></div>
      </section>
    </main>
  </div>

  <script>
    const SUPABASE_URL = 'https://qoipjrrvouchxvcdrpbj.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFvaXBqcnJ2b3VjaHh2Y2RycGJqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2NjUwNTcsImV4cCI6MjEwNTI0MTA1N30.kMnLYLLwnEXdRDEy1uIzYSaA9I_w4SvmrXL83_Fhggw';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let teacherKey = sessionStorage.getItem('cindrebay_teacher_key');

    async function tryEnter(key) {
      const { data, error } = await sb.rpc('verify_teacher_key', { p_key: key });
      if (error || !data) return false;
      teacherKey = key;
      sessionStorage.setItem('cindrebay_teacher_key', key);
      return true;
    }

    async function boot() {
      if (teacherKey) {
        const ok = await tryEnter(teacherKey);
        if (ok) { showApp(); return; }
      }
      document.getElementById('loginGate').style.display = 'flex';
    }

    document.getElementById('gateBtn').addEventListener('click', async () => {
      const key = document.getElementById('teacherKeyInput').value.trim();
      const msg = document.getElementById('gateMsg');
      if (!key) return;
      const ok = await tryEnter(key);
      if (ok) { showApp(); }
      else { msg.textContent = 'Incorrect teacher key.'; }
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      sessionStorage.removeItem('cindrebay_teacher_key');
      window.location.reload();
    });

    function showApp() {
      document.getElementById('loginGate').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      refreshAll();
      setInterval(refreshAll, 8000);
    }

    async function refreshAll() {
      await fetchAllStudents();
      renderRecentSignups();
      renderStudentList();
      await Promise.all([loadQuests(), loadPendingSubmissions()]);
    }

    // ---------- Students (fetched once via teacher-gated RPC, rendered into two panels) ----------
    async function fetchAllStudents() {
      const { data, error } = await sb.rpc('admin_list_students', { p_teacher_key: teacherKey });
      if (error) { console.error(error); return; }
      __allStudents = data || [];
    }

    async function refreshStudents() {
      await fetchAllStudents();
      renderRecentSignups();
      renderStudentList();
    }

    function renderRecentSignups() {
      const recent = [...__allStudents]
        .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
        .slice(0, 8);

      const list = document.getElementById('pendingRegList');
      if (!recent || recent.length === 0) {
        list.innerHTML = '<p class="empty">No sign-ups yet.</p>';
        return;
      }

      list.innerHTML = recent.map(s => `
        <div class="row-card">
          <div class="row-main">
            <div class="row-title">${s.name}</div>
            <div class="row-sub">${s.studio_role || 'No role given'} · PIN ${s.pin_code || '—'}</div>
          </div>
          <span class="tag ${s.is_active ? 'active' : 'inactive'}">${s.is_active ? 'Active' : 'Deactivated'}</span>
        </div>
      `).join('');
    }

    // ---------- Quests ----------
    async function loadQuests() {
      const { data: quests } = await sb.from('quests').select('*').order('quest_id');
      const list = document.getElementById('questList');
      if (!quests || quests.length === 0) { list.innerHTML = '<p class="empty">No quests found.</p>'; return; }

      list.innerHTML = quests.map(q => `
        <div class="row-card">
          <div class="row-main">
            <div class="row-title">${q.quest_id} · ${q.title}</div>
            <div class="row-sub">${q.required_tool || ''} · +${q.points_xp} XP</div>
          </div>
          <span class="tag ${q.status === 'Active' ? 'active' : 'inactive'}">${q.status}</span>
          <div class="row-actions">
            <button class="btn ${q.status === 'Active' ? 'btn-ghost' : 'btn-primary'}" data-quest="${q.quest_id}" data-newstatus="${q.status === 'Active' ? 'Inactive' : 'Active'}">
              ${q.status === 'Active' ? 'Deactivate' : 'Activate'}
            </button>
          </div>
        </div>
      `).join('');

      list.querySelectorAll('button[data-quest]').forEach(btn => {
        btn.addEventListener('click', async () => {
          btn.disabled = true;
          await sb.rpc('set_quest_status', {
            p_teacher_key: teacherKey,
            p_quest_id: btn.dataset.quest,
            p_status: btn.dataset.newstatus,
          });
          loadQuests();
        });
      });
    }

    // ---------- Pending submissions ----------
    async function loadPendingSubmissions() {
      const { data: subs, error } = await sb.rpc('admin_list_pending_submissions', { p_teacher_key: teacherKey });
      if (error) console.error(error);

      const list = document.getElementById('pendingList');
      if (!subs || subs.length === 0) { list.innerHTML = '<p class="empty">No pending submissions right now.</p>'; return; }

      list.innerHTML = subs.map(s => {
        let fileHtml = '';
        if (s.file_path) {
          const publicUrl = `${SUPABASE_URL}/storage/v1/object/public/submissions/${s.file_path}`;
          if (s.file_type === 'image') {
            fileHtml = `<a href="${publicUrl}" target="_blank"><img src="${publicUrl}" alt="Submission file" class="submission-thumb"></a>`;
          } else {
            fileHtml = `<a href="${publicUrl}" target="_blank" class="pdf-link">📄 View PDF</a>`;
          }
        }
        return `
        <div class="row-card">
          <div class="row-main">
            <div class="row-title">${s.student_name || 'Unknown'} — ${s.quest_title || s.quest_id}</div>
            ${s.image_or_link ? `<div class="row-sub link-preview">${s.image_or_link.slice(0, 80)}</div>` : ''}
            ${fileHtml}
          </div>
          <span class="tag pending">Pending</span>
          <div class="row-actions">
            <input type="number" class="xp-input" value="${s.quest_points_xp || 0}" id="xp-${s.submission_id}">
            <button class="btn btn-green" data-approve="${s.submission_id}">Approve</button>
            <button class="btn btn-red" data-reject="${s.submission_id}">Needs Work</button>
          </div>
        </div>
      `;
      }).join('');

      list.querySelectorAll('button[data-approve]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.dataset.approve;
          const xp = parseInt(document.getElementById(`xp-${id}`).value) || 0;
          btn.disabled = true;
          await sb.rpc('review_submission', {
            p_teacher_key: teacherKey,
            p_submission_id: parseInt(id),
            p_status: 'Approved',
            p_xp_awarded: xp,
          });
          refreshAll();
        });
      });

      list.querySelectorAll('button[data-reject]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.dataset.reject;
          btn.disabled = true;
          await sb.rpc('review_submission', {
            p_teacher_key: teacherKey,
            p_submission_id: parseInt(id),
            p_status: 'Needs Iteration',
            p_xp_awarded: 0,
          });
          refreshAll();
        });
      });
    }

    // ---------- Students + quick XP + management ----------
    let __allStudents = [];

    function renderStudentList() {
      const query = (document.getElementById('studentSearch').value || '').toLowerCase().trim();
      const filtered = query
        ? __allStudents.filter(s =>
            (s.name || '').toLowerCase().includes(query) ||
            (s.studio_role || '').toLowerCase().includes(query) ||
            (s.pin_code || '').includes(query))
        : __allStudents;

      const list = document.getElementById('studentList');
      if (!filtered || filtered.length === 0) {
        list.innerHTML = `<p class="empty">${query ? 'No students match your search.' : 'No students yet — add one above.'}</p>`;
        return;
      }

      list.innerHTML = filtered.map(s => `
        <div class="row-card" style="${s.is_active ? '' : 'opacity:0.55;'}">
          <div class="row-main">
            <div class="row-title">${s.name} ${s.is_active ? '' : '<span class="tag inactive" style="margin-left:6px;">Deactivated</span>'}</div>
            <div class="row-sub">${s.studio_role || ''} · ${s.tier_level} · ${s.total_xp} XP · PIN ${s.pin_code || '—'}</div>
          </div>
          <div class="row-actions">
            <button class="btn btn-ghost" data-quickxp="${s.student_id}" data-amount="10">+10</button>
            <button class="btn btn-ghost" data-quickxp="${s.student_id}" data-amount="25">+25</button>
            <button class="btn btn-ghost" data-edit="${s.student_id}">Edit</button>
            <button class="btn ${s.is_active ? 'btn-ghost' : 'btn-green'}" data-toggleactive="${s.student_id}" data-newactive="${s.is_active ? 'false' : 'true'}">${s.is_active ? 'Deactivate' : 'Reactivate'}</button>
            <button class="btn btn-red" data-delete="${s.student_id}">Delete</button>
          </div>
        </div>
      `).join('');

      list.querySelectorAll('button[data-quickxp]').forEach(btn => {
        btn.addEventListener('click', async () => {
          btn.disabled = true;
          await sb.rpc('award_quick_xp', {
            p_teacher_key: teacherKey,
            p_student_id: parseInt(btn.dataset.quickxp),
            p_xp: parseInt(btn.dataset.amount),
          });
          refreshStudents();
        });
      });

      list.querySelectorAll('button[data-toggleactive]').forEach(btn => {
        btn.addEventListener('click', async () => {
          btn.disabled = true;
          await sb.rpc('set_student_active', {
            p_teacher_key: teacherKey,
            p_student_id: parseInt(btn.dataset.toggleactive),
            p_active: btn.dataset.newactive === 'true',
          });
          refreshStudents();
        });
      });

      list.querySelectorAll('button[data-delete]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = parseInt(btn.dataset.delete);
          const student = __allStudents.find(s => s.student_id === id);
          if (!confirm(`Permanently delete ${student ? student.name : 'this student'}? This also deletes all their submissions and cannot be undone.\\n\\nClick Cancel if you only want to deactivate them instead.`)) return;
          btn.disabled = true;
          const { error } = await sb.rpc('delete_student', { p_teacher_key: teacherKey, p_student_id: id });
          if (error) { alert('Could not delete student.'); console.error(error); }
          refreshStudents();
        });
      });

      list.querySelectorAll('button[data-edit]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = parseInt(btn.dataset.edit);
          const student = __allStudents.find(s => s.student_id === id);
          if (!student) return;
          const newName = prompt('Full name:', student.name);
          if (newName === null) return;
          const newRole = prompt('Studio role:', student.studio_role || '');
          if (newRole === null) return;
          const newPin = prompt('4-digit PIN:', student.pin_code || '');
          if (newPin === null) return;
          if (!/^\d{4}$/.test(newPin)) { alert('PIN must be exactly 4 digits.'); return; }

          sb.rpc('update_student', {
            p_teacher_key: teacherKey,
            p_student_id: id,
            p_name: newName.trim(),
            p_studio_role: newRole.trim(),
            p_pin: newPin,
          }).then(({ error }) => {
            if (error) { alert('Could not update student (PIN may already be in use).'); console.error(error); }
            refreshStudents();
          });
        });
      });
    }

    document.getElementById('studentSearch').addEventListener('input', renderStudentList);

    // ---------- Add student ----------
    document.getElementById('addStudentBtn').addEventListener('click', async () => {
      const name = document.getElementById('newName').value.trim();

      const role = document.getElementById('newRole').value.trim();
      const pin = document.getElementById('newPin').value.trim();
      const msg = document.getElementById('addStudentMsg');

      if (!name && pin.length !== 4) {
        msg.style.color = '#dc2626';
        msg.textContent = 'Please fill in the Full Name and 4-digit PIN fields.';
        return;
      }
      if (!name) {
        msg.style.color = '#dc2626';
        msg.textContent = 'Full Name is empty — check you typed it in the first box.';
        return;
      }
      if (pin.length !== 4) {
        msg.style.color = '#dc2626';
        msg.textContent = 'PIN must be exactly 4 digits.';
        return;
      }

      const { error } = await sb.rpc('create_student', {
        p_teacher_key: teacherKey,
        p_name: name,
        p_studio_role: role,
        p_pin: pin,
      });

      if (error) {
        msg.style.color = '#dc2626';
        msg.textContent = 'Could not add student (PIN may already be in use).';
        console.error(error);
        return;
      }

      msg.style.color = '#16a34a';
      msg.textContent = `Added ${name} with PIN ${pin}.`;
      document.getElementById('newName').value = '';
      document.getElementById('newRole').value = '';
      document.getElementById('newPin').value = '';
      refreshStudents();
    });

    // ---------- Live Timer ----------
    async function refreshTimerStatus() {
      const { data } = await sb.rpc('get_timer');
      const row = data && data[0];
      const status = document.getElementById('timerStatus');
      if (!row || !row.ends_at) { status.textContent = 'No timer running.'; return; }
      const ends = new Date(row.ends_at);
      const secsLeft = Math.floor((ends - new Date()) / 1000);
      if (secsLeft <= 0) { status.textContent = 'Timer finished.'; return; }
      const m = Math.floor(secsLeft / 60), s = secsLeft % 60;
      status.textContent = `"${row.label}" — ${m}:${String(s).padStart(2, '0')} remaining`;
    }

    document.getElementById('startTimerBtn').addEventListener('click', async () => {
      const label = document.getElementById('timerLabelInput').value.trim() || 'Time remaining';
      const minutes = parseInt(document.getElementById('timerMinutesInput').value);
      if (!minutes || minutes <= 0) { alert('Enter a number of minutes.'); return; }
      await sb.rpc('set_timer', { p_teacher_key: teacherKey, p_minutes: minutes, p_label: label });
      refreshTimerStatus();
    });

    document.getElementById('stopTimerBtn').addEventListener('click', async () => {
      await sb.rpc('set_timer', { p_teacher_key: teacherKey, p_minutes: 0, p_label: '' });
      refreshTimerStatus();
    });

    // ---------- Bulk quest activation ----------
    async function bulkSetQuests(prefix, status) {
      const { data: quests } = await sb.from('quests').select('quest_id');
      const ids = (quests || []).map(q => q.quest_id).filter(id => prefix ? id.startsWith(prefix) : true);
      if (ids.length === 0) return;
      await sb.rpc('set_quests_status_bulk', { p_teacher_key: teacherKey, p_quest_ids: ids, p_status: status });
      loadQuests();
    }

    document.getElementById('activateDay1Btn').addEventListener('click', () => bulkSetQuests('Q1', 'Active'));
    document.getElementById('activateDay2Btn').addEventListener('click', () => bulkSetQuests('Q2', 'Active'));
    document.getElementById('deactivateAllBtn').addEventListener('click', () => bulkSetQuests('', 'Inactive'));

    // ---------- CSV export ----------
    document.getElementById('exportCsvBtn').addEventListener('click', () => {
      const rows = [['Name', 'Studio Role', 'PIN', 'Tier', 'Total XP', 'Active']];
      __allStudents.forEach(s => {
        rows.push([s.name, s.studio_role || '', s.pin_code || '', s.tier_level, s.total_xp, s.is_active ? 'Yes' : 'No']);
      });
      const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `cindrebay-ai-campus-students-${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    });

    setInterval(refreshTimerStatus, 3000);
    refreshTimerStatus();

    boot();
  </script>
</body>
</html>
