<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cindrebay AI Campus — Live Leaderboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Inter:wght@400..800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
  <style>
    :root {
      --on: #fff5fb;
      --on-2: rgb(255 240 250 / 0.72);
      --on-3: rgb(255 240 250 / 0.5);
      --glass: rgb(255 255 255 / 0.055);
      --glass-2: rgb(255 255 255 / 0.09);
      --edge: rgb(255 255 255 / 0.1);
    }
    html, body { min-height: 100%; }
    body {
      color: var(--on); font-size: clamp(14px, 0.95vw, 18px); background: var(--grad-stage); background-color: #1b0716;
      min-height: 100vh; overflow-x: hidden; padding: clamp(1rem, 2vw, 2.2rem);
    }
    body::before { content: ''; position: fixed; inset: 0; background-image: var(--grain); opacity: 0.1; mix-blend-mode: overlay; pointer-events: none; z-index: 0; }
    .glow { position: fixed; border-radius: 50%; filter: blur(90px); pointer-events: none; z-index: 0; }
    .glow.g1 { width: 46vw; height: 46vw; left: -14vw; top: -18vw; background: #b8438f; opacity: 0.42; animation: drift 24s ease-in-out infinite alternate; }
    .glow.g2 { width: 34vw; height: 34vw; right: -10vw; bottom: -14vw; background: #7a2a64; opacity: 0.5; animation: drift 30s ease-in-out infinite alternate-reverse; }
    .glow.g3 { width: 22vw; height: 22vw; right: 22vw; top: -8vw; background: var(--gold-500); opacity: 0.12; animation: drift 28s ease-in-out infinite alternate; }
    @keyframes drift { to { transform: translate(5vw, 4vw) scale(1.12); } }
    .page { position: relative; z-index: 1; max-width: 1760px; margin: 0 auto; display: flex; flex-direction: column; gap: clamp(0.8rem, 1.3vw, 1.4rem); }

    /* ---------- Header ---------- */
    .head { display: flex; align-items: center; gap: 1.4rem; }
    .head .logo-plate img { height: clamp(26px, 2.2vw, 40px); }
    .titles { flex: 1; min-width: 0; }
    .titles .eyebrow { color: #ffc7e8; }
    .titles h1 { margin: 0.15rem 0 0; font-size: clamp(2rem, 3.4vw, 3.8rem); color: #fff; }
    .titles h1 em { color: #ffc7e8; }
    .live { display: flex; flex-direction: column; align-items: flex-end; gap: 0.2rem; }
    .live .row { display: flex; align-items: center; gap: 0.5rem; font-size: 0.78rem; font-weight: 800; letter-spacing: 0.16em; color: #ff9cc9; }
    #clock { font-family: var(--font-mono); font-size: clamp(1.4rem, 2vw, 2.2rem); font-weight: 700; color: #fff; }
    .qr-card { display: flex; align-items: center; gap: 0.9rem; padding: 0.6rem 0.9rem 0.6rem 0.6rem; border-radius: 18px; background: #fff; color: var(--ink-900); box-shadow: 0 20px 40px -18px rgb(0 0 0 / 0.6); }
    #qrcode { display: flex; }
    #qrcode img, #qrcode canvas { width: clamp(84px, 7vw, 132px) !important; height: auto !important; display: block; border-radius: 8px; }
    .qr-card b { display: block; font-family: var(--font-display); font-weight: 560; font-size: clamp(1rem, 1.3vw, 1.35rem); }
    .qr-card small { color: var(--ink-500); font-size: 0.78rem; line-height: 1.3; display: block; max-width: 11rem; }

    /* ---------- Banners ---------- */
    .banners { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: clamp(0.7rem, 1vw, 1rem); }
    .banners:not(:has(> :not(.hidden))) { display: none; }
    .announce-banner {
      display: flex; align-items: center; gap: 1rem; padding: 0.9rem 1.3rem; border-radius: 20px;
      background: linear-gradient(120deg, #fff2c8, #ffd98a); color: #422800; box-shadow: 0 20px 40px -20px rgb(0 0 0 / 0.6);
      font-size: clamp(1.05rem, 1.35vw, 1.5rem); font-weight: 650; line-height: 1.3;
    }
    .announce-banner #announceText { flex: 1; word-break: break-word; }
    .timer-banner {
      display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 0.7rem 1.3rem; border-radius: 20px;
      background: var(--glass-2); border: 1px solid var(--edge); backdrop-filter: blur(10px);
    }
    .timer-banner span { font-size: clamp(0.95rem, 1.15vw, 1.25rem); font-weight: 650; color: var(--on-2); }
    .timer-banner strong { font-family: var(--font-mono); font-size: clamp(2rem, 3.2vw, 3.4rem); line-height: 1; color: #fff; letter-spacing: 0.02em; }
    .timer-banner.urgent { background: linear-gradient(135deg, #d6332a, #7f1611); border-color: transparent; animation: urgent 1s ease-in-out infinite alternate; }
    @keyframes urgent { to { box-shadow: 0 0 0 8px rgb(214 51 42 / 0.25); } }

    /* ---------- Layout ---------- */
    .layout { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1.2fr) minmax(0, 0.85fr); gap: clamp(0.8rem, 1.3vw, 1.4rem); align-items: start; }
    .panel { position: relative; background: var(--glass); border: 1px solid var(--edge); border-radius: 26px; padding: clamp(1rem, 1.6vw, 1.7rem); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); min-width: 0; }
    .panel-h { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: clamp(0.8rem, 1.2vw, 1.2rem); }
    .panel-h h2 { margin: 0; font-family: var(--font-display); font-weight: 560; font-size: clamp(1.25rem, 1.7vw, 1.9rem); letter-spacing: -0.015em; color: #fff; }
    .panel-h small { color: var(--on-3); font-size: 0.8rem; font-weight: 600; }
    .right { display: flex; flex-direction: column; gap: clamp(0.8rem, 1.3vw, 1.4rem); min-width: 0; }
    .empty { border-color: var(--edge); background: transparent; color: var(--on-3); }

    /* ---------- Podium ---------- */
    .podium-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: end; gap: clamp(0.6rem, 1vw, 1rem); margin-bottom: clamp(0.9rem, 1.4vw, 1.4rem); }
    .podium-item { display: flex; flex-direction: column; align-items: center; text-align: center; min-width: 0; }
    .podium-avatar {
      width: clamp(58px, 5vw, 92px); height: clamp(58px, 5vw, 92px); border-radius: 50%; display: grid; place-items: center;
      font-family: var(--font-display); font-weight: 560; font-size: clamp(1.5rem, 2.2vw, 2.4rem); color: #fff; margin-bottom: 0.55rem;
      background: rgb(255 255 255 / 0.1); position: relative;
    }
    .podium-name { font-weight: 750; font-size: clamp(0.95rem, 1.25vw, 1.35rem); color: #fff; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .podium-xp { font-family: var(--font-mono); font-weight: 700; font-size: clamp(0.85rem, 1.05vw, 1.15rem); color: var(--on-2); margin-top: 0.1rem; }
    .plinth {
      width: 100%; margin-top: 0.7rem; border-radius: 16px 16px 6px 6px; display: grid; place-items: start center; padding-top: 0.6rem;
      font-family: var(--font-display); font-weight: 600; font-size: clamp(1.5rem, 2.4vw, 2.8rem); color: rgb(0 0 0 / 0.35);
    }
    .p1 .plinth { height: clamp(96px, 9vw, 160px); background: linear-gradient(180deg, #ffe08a, #d99a1c); box-shadow: 0 0 60px -10px rgb(255 205 90 / 0.55); }
    .p2 .plinth { height: clamp(70px, 6.6vw, 118px); background: linear-gradient(180deg, #f1eef3, #a9a3ae); }
    .p3 .plinth { height: clamp(54px, 5vw, 90px); background: linear-gradient(180deg, #f3c7a2, #b56d3d); }
    .p1 .podium-avatar { box-shadow: 0 0 0 4px #ffd36b, 0 0 40px rgb(255 205 90 / 0.5); width: clamp(72px, 6.2vw, 112px); height: clamp(72px, 6.2vw, 112px); }
    .p2 .podium-avatar { box-shadow: 0 0 0 4px #d8d3dc; }
    .p3 .podium-avatar { box-shadow: 0 0 0 4px #e4a577; }
    .crown { position: absolute; top: -0.9em; font-size: clamp(1.1rem, 1.6vw, 1.8rem); animation: bob 3s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-4px); } }

    /* ---------- Ranked list ---------- */
    #leaderboardBody { display: flex; flex-direction: column; gap: 0.35rem; }
    .lb-row {
      display: grid; grid-template-columns: 2.4em 2.3em minmax(0, 1.3fr) auto minmax(0, 1fr) 4.2em; align-items: center; gap: 0.8rem;
      padding: 0.5rem 0.75rem; border-radius: 14px; transition: background-color 0.4s;
    }
    .lb-row:nth-child(odd) { background: rgb(255 255 255 / 0.03); }
    .lb-row.bump { animation: bump 2.4s var(--ease-out); }
    @keyframes bump { 0%, 30% { background: rgb(255 205 90 / 0.22); } }
    .lb-rank { font-family: var(--font-mono); font-weight: 700; color: var(--on-3); text-align: right; }
    .lb-av { width: 2.3em; height: 2.3em; border-radius: 50%; display: grid; place-items: center; background: rgb(255 255 255 / 0.1); font-weight: 700; font-size: 0.9em; }
    .lb-name { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tier-tag { font-size: 0.72rem; font-weight: 700; padding: 0.2rem 0.6rem; border-radius: var(--r-pill); background: rgb(255 214 120 / 0.14); color: #ffd98a; white-space: nowrap; }
    .lb-bar { height: 8px; border-radius: 99px; background: rgb(255 255 255 / 0.08); overflow: hidden; }
    .lb-bar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #d474b5, #f5b8dd); transition: width 1s var(--ease-out); }
    .lb-xp { font-family: var(--font-mono); font-weight: 700; text-align: right; color: #fff; }

    /* ---------- Featured work ---------- */
    #featuredWork { transition: opacity 0.35s ease, transform 0.35s ease; }
    #featuredWork.fade { opacity: 0; transform: scale(0.985); }
    .featured-visual {
      position: relative; width: 100%; aspect-ratio: 16 / 10; border-radius: 18px; overflow: hidden;
      background: rgb(255 255 255 / 0.06); display: grid; place-items: center;
    }
    .featured-visual img { width: 100%; height: 100%; object-fit: cover; display: block; animation: kenburns 6s ease-out both; }
    @keyframes kenburns { from { transform: scale(1.06); } to { transform: scale(1); } }
    .featured-visual .file-tile { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; font-size: 3rem; color: #ffc7e8; text-decoration: none; text-align: center; }
    .featured-visual .file-tile span { font-size: 1rem; font-weight: 650; color: var(--on-2); }
    .featured-meta { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 0.9rem; gap: 0.8rem; }
    .featured-who { font-family: var(--font-display); font-weight: 560; font-size: clamp(1.2rem, 1.6vw, 1.8rem); color: #fff; line-height: 1.15; }
    .featured-quest { color: var(--on-2); font-size: 0.9rem; margin-top: 0.15rem; }
    .featured-xp { font-family: var(--font-mono); font-weight: 700; font-size: clamp(1rem, 1.3vw, 1.4rem); color: #0f3d22; background: #8ff0b4; padding: 0.3rem 0.7rem; border-radius: 99px; white-space: nowrap; }
    .featured-dots { display: flex; gap: 6px; justify-content: center; margin-top: 0.8rem; }
    .featured-dots span { width: 7px; height: 7px; border-radius: 50%; background: rgb(255 255 255 / 0.18); transition: width 0.3s, background-color 0.3s; }
    .featured-dots span.active { background: #ff9cc9; width: 22px; border-radius: 99px; }

    /* ---------- Rising star ---------- */
    .rising-star-banner {
      display: flex; align-items: center; gap: 1rem; padding: 0.9rem 1.2rem; border-radius: 22px;
      background: linear-gradient(120deg, #ffe08a, #f2a93b); color: #3d2600; box-shadow: 0 20px 50px -20px rgb(255 190 70 / 0.6);
    }
    .rising-star-banner .star { width: 2.6em; height: 2.6em; border-radius: 50%; background: rgb(255 255 255 / 0.55); display: grid; place-items: center; font-size: 1.2em; flex: none; animation: spin 12s linear infinite; }
    .rising-star-label { display: block; font-size: 0.7rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.8; }
    #risingStarText { font-family: var(--font-display); font-weight: 600; font-size: clamp(1.1rem, 1.4vw, 1.5rem); }

    /* ---------- Recent feed ---------- */
    .feed-item { display: grid; grid-template-columns: 2.2em minmax(0, 1fr) auto; align-items: center; gap: 0.8rem; padding: 0.6rem 0; border-top: 1px solid var(--edge); }
    .feed-item:first-child { border-top: 0; }
    .feed-item.new { animation: slide-in 0.6s var(--ease-spring) both; }
    @keyframes slide-in { from { opacity: 0; transform: translateX(-14px); } }
    .feed-av { width: 2.2em; height: 2.2em; border-radius: 50%; background: rgb(143 240 180 / 0.14); color: #8ff0b4; display: grid; place-items: center; font-weight: 800; }
    .feed-name { font-weight: 650; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .feed-quest { color: var(--on-3); font-size: 0.82rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .feed-xp { font-family: var(--font-mono); font-weight: 700; color: #8ff0b4; white-space: nowrap; text-align: right; }
    .feed-xp small { display: block; color: var(--on-3); font-weight: 500; font-size: 0.72rem; }
    .panel.flash { animation: flash 1.4s ease; }
    @keyframes flash { 25% { box-shadow: 0 0 0 3px #8ff0b4, 0 0 50px rgb(143 240 180 / 0.45); } }

    /* On a projector-sized screen everything fits one viewport: panels stretch and clip instead of scrolling. */
    @media (min-width: 1024px) and (min-height: 600px) {
      body { height: 100vh; overflow: hidden; }
      .page { height: 100%; }
      .layout { flex: 1; min-height: 0; align-items: stretch; }
      #leaderPanel, #featuredPanel, #feedPanel { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
      #leaderboardBody { flex: 1; min-height: 0; overflow: hidden; -webkit-mask-image: linear-gradient(#000 80%, transparent); mask-image: linear-gradient(#000 80%, transparent); }
      #featuredWork { flex: 1; min-height: 0; display: flex; flex-direction: column; }
      .featured-visual { flex: 1; min-height: 0; aspect-ratio: auto; }
      .right { min-height: 0; }
      #feedPanel { flex: 1; }
      #recentFeed { flex: 1; min-height: 0; overflow: hidden; -webkit-mask-image: linear-gradient(#000 80%, transparent); mask-image: linear-gradient(#000 80%, transparent); }
      #qrcode img, #qrcode canvas { width: clamp(72px, 11vh, 132px) !important; }
    }
    @media (max-width: 1500px) {
      .lb-row { grid-template-columns: 2em 2.2em minmax(0, 1fr) minmax(0, 0.8fr) 3.6em; }
      .lb-row .tier-tag { display: none; }
    }
    @media (max-width: 1023px) {
      .layout { grid-template-columns: 1fr; }
      .head { flex-wrap: wrap; }
      .live { display: none; }
      .lb-row { grid-template-columns: 2em 2.2em minmax(0, 1fr) 4em; }
      .lb-row .tier-tag, .lb-row .lb-bar { display: none; }
    }
  </style>
</head>
<body>
  <span class="glow g1"></span><span class="glow g2"></span><span class="glow g3"></span>
  <div class="page">
    <header class="head">
      <span class="logo-plate"><img src="logo.svg" alt="Cindrebay School of Design"></span>
      <div class="titles">
        <span class="eyebrow">AI for Design Professionals · AI Campus</span>
        <h1 class="display">Live <em>Leaderboard</em></h1>
      </div>
      <div class="live"><span class="row"><span class="live-dot"></span>LIVE</span><span id="clock">--:--</span></div>
      <div class="qr-card">
        <div id="qrcode" aria-label="QR code for the student login page"></div>
        <div><b>Scan to join</b><small>Enter your PIN to start earning XP</small></div>
      </div>
    </header>

    <div class="banners">
      <div id="announceBanner" class="announce-banner hidden" role="status">
        <span aria-hidden="true">📢</span>
        <span id="announceText"></span>
      </div>
      <div id="timerBanner" class="timer-banner hidden" role="timer">
        <span id="timerLabel"></span>
        <strong id="timerCountdown">--:--</strong>
      </div>
    </div>

    <div class="layout">
      <section class="panel" id="leaderPanel">
        <div class="panel-h"><h2>🏆 Standings</h2><small id="classSize"></small></div>
        <div id="podium"></div>
        <div id="leaderboardBody"></div>
      </section>

      <section class="panel" id="featuredPanel">
        <div class="panel-h"><h2>Featured work</h2><small>Recently approved</small></div>
        <div id="featuredWork"><p class="empty">Waiting for approved work…</p></div>
      </section>

      <div class="right">
        <div id="risingStarBanner" class="rising-star-banner hidden">
          <span class="star" aria-hidden="true">⭐</span>
          <div><span class="rising-star-label">Rising star · last 24h</span><span id="risingStarText"></span></div>
        </div>

        <section class="panel" id="feedPanel">
          <div class="panel-h"><h2>Just approved</h2></div>
          <div id="recentFeed"><p class="empty">Waiting for submissions…</p></div>
        </section>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://qoipjrrvouchxvcdrpbj.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFvaXBqcnJ2b3VjaHh2Y2RycGJqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2NjUwNTcsImV4cCI6MjEwNTI0MTA1N30.kMnLYLLwnEXdRDEy1uIzYSaA9I_w4SvmrXL83_Fhggw';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    try {
      const loginUrl = window.location.href.replace(/projector\.html.*$/, 'index.html');
      new QRCode(document.getElementById('qrcode'), {
        text: loginUrl,
        width: 256,
        height: 256,
        colorDark: '#211f22',
        colorLight: '#ffffff',
      });
    } catch (e) {
      console.error('QR code failed to render:', e);
    }

    // Escapes text for both element content and quoted attribute values.
    function escapeHtml(str) {
      return String(str ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // Returns the URL only if it is http(s); blocks javascript:, data:, etc.
    function safeUrl(str) {
      try {
        const u = new URL(String(str ?? '').trim());
        return u.protocol === 'http:' || u.protocol === 'https:' ? u.href : '';
      } catch (e) { return ''; }
    }

    function storageUrl(path) {
      return `${SUPABASE_URL}/storage/v1/object/public/submissions/${encodeURIComponent(path)}`;
    }

    function timeAgo(v) {
      const d = v ? new Date(v) : null;
      if (!d || isNaN(d)) return '';
      const s = Math.max(0, (Date.now() - d.getTime()) / 1000);
      if (s < 60) return 'just now';
      if (s < 3600) return `${Math.floor(s / 60)}m ago`;
      if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
      return `${Math.floor(s / 86400)}d ago`;
    }

    function initial(name) { return escapeHtml(String(name || '?').trim().charAt(0).toUpperCase() || '?'); }

    function tickClock() {
      const d = new Date();
      document.getElementById('clock').textContent = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }

    // ---------- Leaderboard: active students only; equal XP shares a rank ----------
    let __prevXpById = null;

    async function loadLeaderboard() {
      const { data: rows } = await sb
        .from('students_directory')
        .select('*')
        .eq('is_active', true)
        .order('total_xp', { ascending: false })
        .limit(15);

      const students = (rows || []).filter(s => s.is_active !== false);
      if (students.length === 0) {
        document.getElementById('podium').innerHTML = '<p class="empty">No students yet.</p>';
        document.getElementById('leaderboardBody').innerHTML = '';
        return;
      }

      const xpOf = s => Number(s.total_xp) || 0;
      const ranks = students.map(s => 1 + students.filter(o => xpOf(o) > xpOf(s)).length);
      const top = Math.max(1, xpOf(students[0]));
      document.getElementById('classSize').textContent = `Top ${students.length}`;

      const top3 = students.slice(0, 3);
      const order = top3.length === 3 ? [1, 0, 2] : top3.map((_, i) => i);
      const podiumHtml = order.filter(i => top3[i]).map(i => {
        const s = top3[i];
        const cls = i === 0 ? 'p1' : i === 1 ? 'p2' : 'p3';
        return `
          <div class="podium-item ${cls}">
            <div class="podium-avatar">${i === 0 ? '<span class="crown" aria-hidden="true">👑</span>' : ''}${initial(s.name)}</div>
            <div class="podium-name">${escapeHtml(s.name)}</div>
            <div class="podium-xp">${xpOf(s)} XP</div>
            <div class="plinth">${ranks[i]}</div>
          </div>
        `;
      }).join('');
      document.getElementById('podium').innerHTML = `<div class="podium-row">${podiumHtml}</div>`;

      // The podium already shows the top three; the list continues from fourth place.
      document.getElementById('leaderboardBody').innerHTML = students.map((s, i) => {
        if (i < 3) return '';
        const bumped = __prevXpById && __prevXpById[s.student_id] !== undefined && xpOf(s) > __prevXpById[s.student_id];
        return `
        <div class="lb-row${bumped ? ' bump' : ''}">
          <span class="lb-rank">${ranks[i]}</span>
          <span class="lb-av" aria-hidden="true">${initial(s.name)}</span>
          <span class="lb-name">${escapeHtml(s.name)}</span>
          <span class="tier-tag">${escapeHtml(s.tier_level)}</span>
          <span class="lb-bar" aria-hidden="true"><i style="width:${Math.max(2, (xpOf(s) / top) * 100)}%"></i></span>
          <span class="lb-xp">${xpOf(s)}</span>
        </div>`;
      }).join('');

      __prevXpById = {};
      students.forEach(s => { __prevXpById[s.student_id] = xpOf(s); });
    }

    let __seenApprovals = null; // submission_id:reviewed_at pairs already shown
    let __audioCtx = null;

    function playDing() {
      try {
        if (!__audioCtx) __audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const ctx = __audioCtx;
        [0, 0.12].forEach((at, i) => {
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.connect(g); g.connect(ctx.destination);
          o.type = 'sine';
          o.frequency.setValueAtTime(i ? 1318.5 : 880, ctx.currentTime + at);
          g.gain.setValueAtTime(0.0001, ctx.currentTime + at);
          g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + at + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + at + 0.5);
          o.start(ctx.currentTime + at);
          o.stop(ctx.currentTime + at + 0.55);
        });
      } catch (e) { /* audio not available, fail silently */ }
    }

    function flashPanel() {
      const panel = document.getElementById('feedPanel');
      if (!panel) return;
      panel.classList.remove('flash');
      void panel.offsetWidth;
      panel.classList.add('flash');
    }

    // Newest approvals first (by when they were approved, not when they were submitted).
    async function loadRecentFeed() {
      const [{ data: subs }, { data: names }] = await Promise.all([
        sb.from('submissions')
          .select('*, quests(title)')
          .eq('status', 'Approved')
          .order('reviewed_at', { ascending: false, nullsFirst: false })
          .limit(6),
        sb.from('students_directory').select('student_id, name'),
      ]);

      const nameById = {};
      (names || []).forEach(n => { nameById[n.student_id] = n.name; });

      const feed = document.getElementById('recentFeed');
      if (!subs || subs.length === 0) {
        feed.innerHTML = '<p class="empty">Waiting for submissions…</p>';
        __seenApprovals = __seenApprovals || new Set();
        return;
      }

      const key = s => `${s.submission_id}:${s.reviewed_at || ''}`;
      const fresh = __seenApprovals ? subs.filter(s => !__seenApprovals.has(key(s))) : [];
      if (fresh.length) { playDing(); flashPanel(); }
      __seenApprovals = new Set([...(__seenApprovals || []), ...subs.map(key)]);
      const freshKeys = new Set(fresh.map(key));

      feed.innerHTML = subs.map(s => {
        const who = nameById[s.student_id] || 'Student';
        return `
        <div class="feed-item${freshKeys.has(key(s)) ? ' new' : ''}">
          <span class="feed-av" aria-hidden="true">${initial(who)}</span>
          <div style="min-width:0">
            <div class="feed-name">${escapeHtml(who)}</div>
            <div class="feed-quest">${escapeHtml(s.quests?.title || s.quest_id)}</div>
          </div>
          <div class="feed-xp">+${Number(s.xp_awarded) || 0} XP<small>${escapeHtml(timeAgo(s.reviewed_at))}</small></div>
        </div>`;
      }).join('');
    }

    let __timerEnds = null;
    async function syncTimer() {
      const { data } = await sb.rpc('get_timer');
      const row = data && data[0];
      __timerEnds = row && row.ends_at ? new Date(row.ends_at) : null;
      document.getElementById('timerLabel').textContent = row ? (row.label || 'Time remaining') : '';
    }

    function tickTimer() {
      const banner = document.getElementById('timerBanner');
      if (!__timerEnds) { banner.classList.add('hidden'); return; }
      const secs = Math.floor((__timerEnds - new Date()) / 1000);
      if (secs <= 0) { banner.classList.add('hidden'); return; }
      banner.classList.remove('hidden');
      banner.classList.toggle('urgent', secs <= 60);
      const m = String(Math.floor(secs / 60)).padStart(2, '0');
      const s = String(secs % 60).padStart(2, '0');
      document.getElementById('timerCountdown').textContent = `${m}:${s}`;
    }

    async function loadRisingStar() {
      const since = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
      const { data: subs } = await sb
        .from('submissions')
        .select('student_id, xp_awarded')
        .eq('status', 'Approved')
        .gte('reviewed_at', since);

      const banner = document.getElementById('risingStarBanner');
      if (!subs || subs.length === 0) { banner.classList.add('hidden'); return; }

      const totals = {};
      subs.forEach(s => { totals[s.student_id] = (totals[s.student_id] || 0) + (s.xp_awarded || 0); });

      let winnerId = null, winnerXp = 0;
      Object.entries(totals).forEach(([id, xp]) => {
        if (xp > winnerXp) { winnerId = id; winnerXp = xp; }
      });

      if (!winnerId || winnerXp <= 0) { banner.classList.add('hidden'); return; }

      const { data: winner } = await sb
        .from('students_directory')
        .select('name')
        .eq('student_id', Number(winnerId))
        .single();

      if (!winner) { banner.classList.add('hidden'); return; }

      document.getElementById('risingStarText').textContent = `${winner.name} — +${winnerXp} XP`;
      banner.classList.remove('hidden');
    }

    let __featuredWorks = [];
    let __featuredIndex = 0;

    async function loadFeaturedWork() {
      const [{ data: subs }, { data: names }] = await Promise.all([
        sb.from('submissions')
          .select('*, quests(title)')
          .eq('status', 'Approved')
          .order('reviewed_at', { ascending: false, nullsFirst: false })
          .limit(10),
        sb.from('students_directory').select('student_id, name'),
      ]);

      const nameById = {};
      (names || []).forEach(n => { nameById[n.student_id] = n.name; });

      __featuredWorks = (subs || [])
        .filter(s => s.file_path || s.image_or_link)
        .map(s => ({
          name: nameById[s.student_id] || 'Student',
          quest: s.quests?.title || s.quest_id,
          xp: s.xp_awarded,
          filePath: s.file_path,
          fileType: s.file_type,
          link: s.image_or_link,
        }));

      if (__featuredIndex >= __featuredWorks.length) __featuredIndex = 0;
      renderFeaturedWork();
    }

    function renderFeaturedWork() {
      const box = document.getElementById('featuredWork');
      if (__featuredWorks.length === 0) {
        box.innerHTML = '<p class="empty">Waiting for approved work…</p>';
        return;
      }

      const w = __featuredWorks[__featuredIndex];
      let visual;
      if (w.filePath) {
        const url = escapeHtml(storageUrl(w.filePath));
        visual = w.fileType === 'image'
          ? `<img src="${url}" alt="Approved work by ${escapeHtml(w.name)}">`
          : `<a href="${url}" target="_blank" rel="noopener noreferrer" class="file-tile">📄<span>View PDF</span></a>`;
      } else {
        const link = safeUrl(w.link);
        visual = link
          ? `<a href="${escapeHtml(link)}" target="_blank" rel="noopener noreferrer" class="file-tile">🔗<span>View Submission</span></a>`
          : `<div class="file-tile">📝<span>Text submission</span></div>`;
      }

      const dots = __featuredWorks.length > 1
        ? `<div class="featured-dots">${__featuredWorks.map((_, i) => `<span class="${i === __featuredIndex ? 'active' : ''}"></span>`).join('')}</div>`
        : '';

      box.innerHTML = `
        <div class="featured-visual">${visual}</div>
        <div class="featured-meta">
          <div>
            <div class="featured-who">${escapeHtml(w.name)}</div>
            <div class="featured-quest">${escapeHtml(w.quest)}</div>
          </div>
          <div class="featured-xp">+${Number(w.xp) || 0} XP</div>
        </div>
        ${dots}
      `;
    }

    function rotateFeaturedWork() {
      if (__featuredWorks.length <= 1) return;
      const box = document.getElementById('featuredWork');
      box.classList.add('fade');
      setTimeout(() => {
        __featuredIndex = (__featuredIndex + 1) % __featuredWorks.length;
        renderFeaturedWork();
        box.classList.remove('fade');
      }, 300);
    }

    async function syncAnnouncement() {
      try {
        const { data, error } = await sb.rpc('get_announcement');
        if (error) return; // keep whatever is showing
        const message = data && data[0] && data[0].message ? String(data[0].message) : '';
        const banner = document.getElementById('announceBanner');
        document.getElementById('announceText').textContent = message;
        banner.classList.toggle('hidden', !message);
      } catch (e) { /* optional: never break the projector */ }
    }

    async function refreshAll() {
      await Promise.all([loadLeaderboard(), loadRecentFeed(), loadRisingStar(), loadFeaturedWork(), syncTimer(), syncAnnouncement()]);
    }

    tickClock();
    refreshAll();
    setInterval(refreshAll, 6000);
    setInterval(tickTimer, 1000);
    setInterval(tickClock, 5000);
    setInterval(rotateFeaturedWork, 6500);
  </script>
</body>
</html>
