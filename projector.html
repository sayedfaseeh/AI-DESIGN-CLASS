<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cindrebay AI Campus — Live Leaderboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink: #B74094; --pink-dark: #8f3175; --pink-light: #fbeef7;
      --charcoal: #424143; --olive: #A6A970; --gray: #6b7280; --gray-light: #f3f4f6;
      --gold: #ca8a04; --amber-bg: #fffbeb; --green: #16a34a;
    }
    * { box-sizing: border-box; }
    html, body { overflow-x: hidden; width: 100%; }
    body {
      font-family: 'Inter', sans-serif; margin: 0;
      background: linear-gradient(160deg, #fbeef7 0%, #f3e4ee 100%);
      color: var(--charcoal); min-height: 100vh; padding: 2.5rem;
    }
    .title-bar { text-align: center; margin-bottom: 2rem; }
    .title-bar img { height: 56px; margin-bottom: 0.75rem; }
    .badge {
      display: inline-block; background: var(--pink-light); color: var(--pink);
      font-size: 0.75rem; font-weight: 600; padding: 4px 10px; border-radius: 100px;
      letter-spacing: 0.02em; margin-bottom: 0.5rem;
    }
    .title-bar h1 { font-size: 1.75rem; font-weight: 800; margin: 0; color: var(--charcoal); }
    .title-bar p { color: var(--gray); margin: 4px 0 0; font-size: 1rem; }

    .layout {
      display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
      gap: 2rem; align-items: start; max-width: 1200px; margin: 0 auto; width: 100%;
    }

    .panel {
      background: white; border-radius: 16px; padding: 1.75rem;
      box-shadow: 0 20px 40px -20px rgb(183 64 148 / 0.2);
      min-width: 0; max-width: 100%; overflow: hidden;
    }
    .panel h2 { font-size: 1.1rem; margin: 0 0 1.25rem; color: var(--charcoal); font-weight: 700; }

    .podium-row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 1rem; margin-bottom: 1.5rem; justify-content: center; }
    .podium-item { text-align: center; }
    .podium-avatar {
      width: 56px; height: 56px; border-radius: 50%; margin: 0 auto 6px;
      display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.3rem;
      background: var(--pink-light); color: var(--pink);
    }
    .p1 .podium-avatar { width: 76px; height: 76px; font-size: 1.7rem; background: var(--gold); color: white; }
    .p2 .podium-avatar { background: #e5e7eb; color: var(--charcoal); }
    .p3 .podium-avatar { background: #f3d9c4; color: #92400e; }
    .podium-name { font-weight: 700; font-size: 0.95rem; color: var(--charcoal); }
    .podium-xp { color: var(--gray); font-size: 0.8rem; }
    .medal { font-size: 1.4rem; }

    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th { text-align: left; color: var(--gray); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.03em; padding: 6px 8px; }
    td { padding: 10px 8px; font-size: 0.95rem; border-top: 1px solid var(--gray-light); color: var(--charcoal); }
    .rank-cell { font-weight: 700; width: 40px; color: var(--pink); }
    .tier-tag {
      font-size: 0.7rem; font-weight: 600; color: var(--gold); background: var(--amber-bg);
      padding: 2px 9px; border-radius: 100px;
    }

    .feed-item {
      display: flex; justify-content: space-between; gap: 0.5rem;
      padding: 10px 0; border-top: 1px solid var(--gray-light); font-size: 0.9rem;
    }
    .feed-item:first-child { border-top: none; }
    .feed-name { font-weight: 600; color: var(--charcoal); }
    .feed-quest { color: var(--gray); font-size: 0.8rem; }
    .feed-xp { color: var(--green); font-weight: 700; white-space: nowrap; }

    .qr-box { text-align: center; margin-top: 1.5rem; }
    .qr-box canvas { border-radius: 12px; border: 1px solid var(--gray-light); padding: 10px; }
    .qr-box p { margin-top: 0.75rem; color: var(--gray); font-size: 0.9rem; }
    .empty { color: var(--gray); text-align: center; padding: 1rem 0; font-size: 0.9rem; }
    .timer-banner {
      max-width: 1200px; margin: 0 auto 1.5rem; background: linear-gradient(135deg, #B74094, #8f3175);
      color: white; border-radius: 16px; padding: 1rem 1.75rem;
      display: flex; justify-content: space-between; align-items: center; gap: 1rem;
      box-shadow: 0 20px 40px -20px rgb(183 64 148 / 0.35);
    }
    .timer-banner span { font-size: 1.1rem; font-weight: 600; }
    .timer-banner strong { font-size: 2.2rem; font-variant-numeric: tabular-nums; }
    .timer-banner.urgent { background: linear-gradient(135deg, #dc2626, #991b1b); }
    .rising-star-banner {
      max-width: 1200px; margin: 0 auto 1.5rem; background: linear-gradient(135deg, #ca8a04, #a16207);
      color: white; border-radius: 16px; padding: 0.85rem 1.75rem;
      display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;
      box-shadow: 0 20px 40px -20px rgb(202 138 4 / 0.4);
    }
    .rising-star-label { font-weight: 800; font-size: 1rem; white-space: nowrap; }
    #risingStarText { font-size: 1.05rem; font-weight: 600; }
    .hidden { display: none !important; }

    @media (max-width: 860px) {
      body { padding: 1.25rem; }
      .layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="title-bar">
    <img src="logo.svg" alt="Cindrebay School of Design">
    <div class="badge">AI FOR DESIGN PROFESSIONALS</div>
    <h1>Live Leaderboard</h1>
    <p>Cindrebay School of Design · AI Campus</p>
  </div>

  <div id="timerBanner" class="timer-banner hidden">
    <span id="timerLabel"></span>
    <strong id="timerCountdown">--:--</strong>
  </div>

  <div id="risingStarBanner" class="rising-star-banner hidden">
    <span class="rising-star-label">⭐ Rising Star — last 24h</span>
    <span id="risingStarText"></span>
  </div>

  <div class="layout">
    <div class="panel">
      <h2>🏆 Leaderboard</h2>
      <div id="podium"></div>
      <table>
        <thead><tr><th>#</th><th>Name</th><th>Tier</th><th style="text-align:right">XP</th></tr></thead>
        <tbody id="leaderboardBody"></tbody>
      </table>
    </div>

    <div>
      <div class="panel">
        <h2>✨ Recent Approved Work</h2>
        <div id="recentFeed"><p class="empty">Waiting for submissions…</p></div>
      </div>
      <div class="panel qr-box" style="margin-top: 1.5rem;">
        <div id="qrcode"></div>
        <p>Scan to join — enter your PIN to start</p>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://qoipjrrvouchxvcdrpbj.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFvaXBqcnJ2b3VjaHh2Y2RycGJqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2NjUwNTcsImV4cCI6MjEwNTI0MTA1N30.kMnLYLLwnEXdRDEy1uIzYSaA9I_w4SvmrXL83_Fhggw';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    try {
      const loginUrl = window.location.href.replace(/projector\.html.*$/, 'index.html');
      new QRCode(document.getElementById('qrcode'), {
        text: loginUrl,
        width: 160,
        height: 160,
      });
    } catch (e) {
      console.error('QR code failed to render:', e);
    }

    async function loadLeaderboard() {
      const { data: students } = await sb
        .from('students_directory')
        .select('*')
        .order('total_xp', { ascending: false })
        .limit(15);

      if (!students || students.length === 0) {
        document.getElementById('podium').innerHTML = '<p class="empty">No students yet.</p>';
        document.getElementById('leaderboardBody').innerHTML = '';
        return;
      }

      const top3 = students.slice(0, 3);
      const medals = ['🥇', '🥈', '🥉'];
      const order = top3.length === 3 ? [1, 0, 2] : top3.map((_, i) => i);
      const podiumHtml = order.filter(i => top3[i]).map(i => {
        const s = top3[i];
        const cls = i === 0 ? 'p1' : i === 1 ? 'p2' : 'p3';
        return `
          <div class="podium-item ${cls}">
            <div class="medal">${medals[i]}</div>
            <div class="podium-avatar">${s.name.charAt(0).toUpperCase()}</div>
            <div class="podium-name">${s.name}</div>
            <div class="podium-xp">${s.total_xp} XP</div>
          </div>
        `;
      }).join('');
      document.getElementById('podium').innerHTML = `<div class="podium-row">${podiumHtml}</div>`;

      document.getElementById('leaderboardBody').innerHTML = students.map((s, i) => `
        <tr>
          <td class="rank-cell">${i + 1}</td>
          <td>${s.name}</td>
          <td><span class="tier-tag">${s.tier_level}</span></td>
          <td style="text-align:right; font-weight:700;">${s.total_xp}</td>
        </tr>
      `).join('');
    }

    let __lastSeenSubmissionId = null;
    let __audioCtx = null;

    function playDing() {
      try {
        if (!__audioCtx) __audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const ctx = __audioCtx;
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type = 'sine';
        o.frequency.setValueAtTime(880, ctx.currentTime);
        o.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.12);
        g.gain.setValueAtTime(0.0001, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.5);
        o.start();
        o.stop(ctx.currentTime + 0.5);
      } catch (e) { /* audio not available, fail silently */ }
    }

    function flashPanel() {
      const panel = document.querySelector('.panel');
      if (!panel) return;
      panel.style.transition = 'box-shadow 0.3s ease';
      panel.style.boxShadow = '0 0 0 3px #4ade80, 0 0 40px rgba(74,222,128,0.4)';
      setTimeout(() => { panel.style.boxShadow = ''; }, 1200);
    }

    async function loadRecentFeed() {
      const { data: subs } = await sb
        .from('submissions')
        .select('*, students(name), quests(title)')
        .eq('status', 'Approved')
        .order('submission_id', { ascending: false })
        .limit(6);

      const feed = document.getElementById('recentFeed');
      if (!subs || subs.length === 0) {
        feed.innerHTML = '<p class="empty">Waiting for submissions…</p>';
        return;
      }

      const topId = subs[0].submission_id;
      if (__lastSeenSubmissionId !== null && topId !== __lastSeenSubmissionId) {
        playDing();
        flashPanel();
      }
      __lastSeenSubmissionId = topId;

      feed.innerHTML = subs.map(s => `
        <div class="feed-item">
          <div>
            <div class="feed-name">${s.students?.name || 'Student'}</div>
            <div class="feed-quest">${s.quests?.title || s.quest_id}</div>
          </div>
          <div class="feed-xp">+${s.xp_awarded} XP</div>
        </div>
      `).join('');
    }

    let __timerEnds = null;
    async function syncTimer() {
      const { data } = await sb.rpc('get_timer');
      const row = data && data[0];
      __timerEnds = row && row.ends_at ? new Date(row.ends_at) : null;
      document.getElementById('timerLabel').textContent = row ? (row.label || 'Time remaining') : '';
    }

    function tickTimer() {
      const banner = document.getElementById('timerBanner');
      if (!__timerEnds) { banner.classList.add('hidden'); return; }
      const secs = Math.floor((__timerEnds - new Date()) / 1000);
      if (secs <= 0) { banner.classList.add('hidden'); return; }
      banner.classList.remove('hidden');
      banner.classList.toggle('urgent', secs <= 60);
      const m = String(Math.floor(secs / 60)).padStart(2, '0');
      const s = String(secs % 60).padStart(2, '0');
      document.getElementById('timerCountdown').textContent = `${m}:${s}`;
    }

    async function loadRisingStar() {
      const since = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
      const { data: subs } = await sb
        .from('submissions')
        .select('student_id, xp_awarded')
        .eq('status', 'Approved')
        .gte('reviewed_at', since);

      const banner = document.getElementById('risingStarBanner');
      if (!subs || subs.length === 0) { banner.classList.add('hidden'); return; }

      const totals = {};
      subs.forEach(s => { totals[s.student_id] = (totals[s.student_id] || 0) + (s.xp_awarded || 0); });

      let winnerId = null, winnerXp = 0;
      Object.entries(totals).forEach(([id, xp]) => {
        if (xp > winnerXp) { winnerId = id; winnerXp = xp; }
      });

      if (!winnerId || winnerXp <= 0) { banner.classList.add('hidden'); return; }

      const { data: winner } = await sb
        .from('students_directory')
        .select('name')
        .eq('student_id', winnerId)
        .single();

      if (!winner) { banner.classList.add('hidden'); return; }

      document.getElementById('risingStarText').textContent = `${winner.name} — +${winnerXp} XP`;
      banner.classList.remove('hidden');
    }

    async function refreshAll() {
      await Promise.all([loadLeaderboard(), loadRecentFeed(), loadRisingStar(), syncTimer()]);
    }

    refreshAll();
    setInterval(refreshAll, 6000);
    setInterval(tickTimer, 1000);
  </script>
</body>
</html>
