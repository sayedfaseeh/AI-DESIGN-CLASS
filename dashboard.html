<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cindrebay AI Campus — Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue: #B74094; --blue-light: #fbeef7; --gray: #6b7280;
      --gray-light: #f3f4f6; --green: #16a34a; --gold: #ca8a04; --amber-bg: #fffbeb;
    }
    * { box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #f8fafc; color: #1f2937; margin: 0; padding: 0; }
    header {
      background: linear-gradient(135deg, #B74094, #8f3175); color: white;
      padding: 1rem 1.25rem; text-align: center; position: relative;
    }
    header h1 { font-size: 1.1rem; font-weight: 700; margin: 0; }
    #logoutBtn {
      position: absolute; right: 1rem; top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,0.15); border: none; color: white;
      font-size: 0.75rem; padding: 6px 12px; border-radius: 100px; cursor: pointer;
    }
    main { max-width: 760px; margin: 0 auto; padding: 1.25rem; }
    .profile-card {
      background: white; border-radius: 14px; padding: 1.5rem;
      display: flex; align-items: center; gap: 1rem; box-shadow: 0 1px 3px rgb(0 0 0 / 0.06);
    }
    .avatar {
      width: 64px; height: 64px; border-radius: 50%; background: var(--blue-light);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; font-weight: 700; color: var(--blue); flex-shrink: 0;
    }
    .profile-info { flex: 1; min-width: 0; }
    .profile-info h2 { font-size: 1.2rem; font-weight: 700; margin: 0 0 2px; }
    .tier-badge {
      display: inline-block; font-size: 0.75rem; font-weight: 600; color: var(--gold);
      background: var(--amber-bg); padding: 2px 10px; border-radius: 100px; margin-bottom: 8px;
    }
    .rank-badge {
      display: inline-block; font-size: 0.75rem; font-weight: 600; color: var(--blue);
      background: var(--blue-light); padding: 2px 10px; border-radius: 100px; margin-bottom: 8px; margin-left: 6px;
    }
    .streak-badge {
      display: inline-block; font-size: 0.75rem; font-weight: 600; color: #b45309;
      background: #fffbeb; padding: 2px 10px; border-radius: 100px; margin-bottom: 8px; margin-left: 6px;
    }
    .xp-row { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--gray); margin-bottom: 4px; }
    .xp-wrap { position: relative; }
    .xp-bar { background: var(--gray-light); border-radius: 100px; height: 10px; overflow: hidden; }
    .xp-fill { background: linear-gradient(90deg, #d874b8, #B74094); height: 100%; transition: width 0.6s ease; border-radius: 100px; }
    .xp-bar.pulse { animation: xp-bar-pulse 0.9s ease; }
    @keyframes xp-bar-pulse {
      0%, 100% { box-shadow: none; }
      40% { box-shadow: 0 0 0 4px rgba(183, 64, 148, 0.35); }
    }
    .xp-float {
      position: absolute; top: -4px; right: 0; font-weight: 700; font-size: 0.85rem;
      color: var(--green); pointer-events: none; animation: xp-float-up 1.4s ease-out forwards;
    }
    @keyframes xp-float-up {
      0% { opacity: 0; transform: translateY(0); }
      15% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-22px); }
    }

    section { margin-top: 1.5rem; }
    section h3 { font-size: 1rem; font-weight: 700; margin: 0 0 0.75rem; }
    .quest-grid { display: grid; gap: 0.75rem; }
    .quest {
      background: white; border: 1.5px solid var(--gray-light); border-radius: 12px;
      padding: 1rem; cursor: pointer; transition: border-color 0.15s;
    }
    .quest:hover { border-color: var(--blue); }
    .quest.selected { border-color: var(--blue); background: var(--blue-light); }
    .quest-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem; }
    .quest h4 { font-size: 0.95rem; font-weight: 600; margin: 0; }
    .xp-pill {
      background: var(--blue); color: white; font-size: 0.7rem; font-weight: 700;
      padding: 3px 8px; border-radius: 100px; white-space: nowrap;
    }
    .quest .tool { font-size: 0.8rem; color: var(--gray); margin-top: 4px; }
    .quest .my-status { font-size: 0.75rem; font-weight: 600; margin-top: 6px; }
    .status-pending { color: #b45309; }
    .status-approved { color: var(--green); }
    .status-iteration { color: #dc2626; }
    .my-feedback {
      font-size: 0.8rem; color: #374151; background: var(--gray-light);
      border-radius: 8px; padding: 6px 10px; margin-top: 6px; line-height: 1.4;
    }

    /* My Work */
    .mywork-summary { font-size: 0.85rem; color: var(--gray); margin: -0.25rem 0 0.75rem; }
    .portfolio-btn {
      background: var(--blue); color: white; border: none; border-radius: 8px; padding: 8px 14px;
      font-size: 0.85rem; font-weight: 600; cursor: pointer; font-family: inherit; margin-bottom: 0.9rem;
    }
    .portfolio-btn:disabled { background: var(--gray); opacity: 0.5; cursor: not-allowed; }
    .work-card {
      background: white; border-radius: 12px; padding: 0.9rem 1rem; margin-bottom: 0.6rem;
      box-shadow: 0 1px 3px rgb(0 0 0 / 0.06);
    }
    .work-card .work-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem; }
    .work-card h4 { margin: 0; font-size: 0.95rem; font-weight: 600; }
    .work-card .work-text { font-size: 0.8rem; color: var(--gray); margin-top: 6px; word-break: break-word; }
    .work-card .work-text a { color: var(--blue); }
    .work-card img.work-thumb { max-width: 140px; max-height: 100px; border-radius: 8px; margin-top: 8px; display: block; border: 1px solid var(--gray-light); }

    /* Locked badge hint + prompt category chips */
    .badge-item .hint { font-size: 0.6rem; color: var(--gray); margin-top: 3px; line-height: 1.25; }
    .cat-chips { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 0.75rem; }
    .cat-chip {
      background: white; border: 1.5px solid var(--gray-light); color: var(--gray);
      border-radius: 100px; padding: 4px 12px; font-size: 0.78rem; font-weight: 600;
      cursor: pointer; font-family: inherit;
    }
    .cat-chip.active { background: var(--blue); color: white; border-color: var(--blue); }

    .submit-panel {
      background: white; border-radius: 14px; padding: 1.25rem;
      box-shadow: 0 1px 3px rgb(0 0 0 / 0.06); margin-top: 1.5rem;
    }
    .submit-panel.hidden { display: none; }
    .submit-panel label { display: block; font-size: 0.85rem; font-weight: 500; margin-bottom: 0.5rem; }
    .submit-panel textarea {
      width: 100%; border: 1.5px solid var(--gray-light); border-radius: 8px;
      padding: 0.7rem; font-family: inherit; font-size: 0.9rem; resize: vertical; min-height: 70px;
    }
    .submit-panel button {
      background: var(--blue); color: white; border: none; border-radius: 8px;
      font-weight: 600; padding: 0.7rem 1.25rem; margin-top: 0.75rem; cursor: pointer; font-size: 0.9rem;
    }
    .submit-panel button:disabled { background: var(--gray); cursor: not-allowed; }
    .file-label { display: block; font-size: 0.78rem; color: var(--gray); margin: 0.8rem 0 0.4rem; }
    #submissionFile {
      font-size: 0.85rem; width: 100%;
    }
    .file-chosen { font-size: 0.8rem; color: var(--blue); margin-top: 0.4rem; word-break: break-all; }
    #submitMsg { font-size: 0.85rem; margin-top: 0.5rem; }
    .empty { color: var(--gray); font-size: 0.9rem; text-align: center; padding: 2rem 0; }
    .hidden { display: none !important; }

    /* Timer banner */
    .announce {
      background: #fffbeb; border: 1.5px solid #fcd34d; color: #78350f; border-radius: 12px;
      padding: 0.7rem 0.9rem; margin-bottom: 1rem; display: flex; align-items: flex-start; gap: 0.6rem; font-size: 0.9rem; line-height: 1.4;
    }
    .announce-text { flex: 1; word-break: break-word; }
    .announce-close { background: transparent; border: none; color: #92400e; cursor: pointer; font-size: 0.95rem; padding: 0 2px; }
    .timer-banner {
      background: linear-gradient(135deg, #B74094, #8f3175); color: white;
      border-radius: 12px; padding: 0.75rem 1.25rem; margin-bottom: 1rem;
      display: flex; justify-content: space-between; align-items: center; gap: 1rem;
    }
    .timer-banner strong { font-size: 1.4rem; font-variant-numeric: tabular-nums; }
    .timer-banner.urgent { background: linear-gradient(135deg, #dc2626, #991b1b); }

    /* Badges */
    .badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 0.6rem; }
    .badge-item {
      background: white; border-radius: 12px; padding: 0.75rem 0.4rem; text-align: center;
      box-shadow: 0 1px 3px rgb(0 0 0 / 0.06); border: 1.5px solid var(--gray-light);
    }
    .badge-item.locked { opacity: 0.4; filter: grayscale(1); }
    .badge-item .icon { font-size: 1.6rem; line-height: 1; }
    .badge-item .name { font-size: 0.68rem; font-weight: 600; margin-top: 4px; color: var(--charcoal, #424143); }

    /* Tabs */
    .tabs { display: flex; gap: 0.4rem; margin-top: 1.5rem; flex-wrap: wrap; }
    .tab {
      background: white; border: 1.5px solid var(--gray-light); color: var(--gray);
      border-radius: 100px; padding: 6px 16px; font-size: 0.85rem; font-weight: 600;
      cursor: pointer; font-family: inherit;
    }
    .tab.active { background: var(--blue); color: white; border-color: var(--blue); }

    /* Gallery */
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0.75rem; }
    .gallery-card {
      background: white; border-radius: 12px; overflow: hidden;
      box-shadow: 0 1px 3px rgb(0 0 0 / 0.06);
    }
    .gallery-card img { width: 100%; height: 120px; object-fit: cover; display: block; }
    .gallery-card .meta { padding: 0.5rem 0.6rem; }
    .gallery-card .who { font-size: 0.8rem; font-weight: 600; }
    .gallery-card .what { font-size: 0.7rem; color: var(--gray); }
    .gallery-card .pdf-tile {
      height: 120px; display: flex; align-items: center; justify-content: center;
      background: var(--blue-light); font-size: 1.8rem; text-decoration: none;
    }

    /* Prompt library */
    .prompt-search {
      width: 100%; border: 1.5px solid var(--gray-light); border-radius: 8px;
      padding: 10px 12px; font-size: 0.9rem; margin-bottom: 0.75rem; font-family: inherit;
    }
    .prompt-card {
      background: white; border-radius: 12px; padding: 1rem; margin-bottom: 0.6rem;
      box-shadow: 0 1px 3px rgb(0 0 0 / 0.06);
    }
    .prompt-card .top { display: flex; justify-content: space-between; gap: 0.5rem; align-items: baseline; flex-wrap: wrap; }
    .prompt-card h4 { margin: 0; font-size: 0.95rem; }
    .prompt-card .tool-tag {
      font-size: 0.68rem; font-weight: 600; color: var(--blue);
      background: var(--blue-light); padding: 2px 8px; border-radius: 100px;
    }
    .prompt-card pre {
      background: #f8fafc; border: 1px solid var(--gray-light); border-radius: 8px;
      padding: 0.7rem; font-size: 0.8rem; white-space: pre-wrap; word-break: break-word;
      margin: 0.5rem 0 0.4rem; font-family: ui-monospace, monospace;
    }
    .prompt-card .notes { font-size: 0.78rem; color: var(--gray); font-style: italic; }
    .copy-btn {
      background: var(--gray-light); border: none; border-radius: 6px; padding: 5px 12px;
      font-size: 0.75rem; font-weight: 600; cursor: pointer; font-family: inherit; margin-top: 0.4rem;
    }
    .copy-btn.copied { background: #dcfce7; color: #16a34a; }
    .fav-btn { margin-left: 0.4rem; }
    .fav-btn.on { background: #fef3c7; color: #b45309; }

    /* Gallery filter + lightbox */
    .gallery-filter { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.75rem; font-size: 0.85rem; color: var(--gray); }
    .gallery-filter select { border: 1.5px solid var(--gray-light); border-radius: 8px; padding: 6px 10px; font-size: 0.85rem; font-family: inherit; background: white; }
    .lightbox {
      position: fixed; inset: 0; background: rgba(17, 24, 39, 0.85); z-index: 10001;
      display: flex; align-items: center; justify-content: center; padding: 1rem;
    }
    .lightbox-inner { position: relative; max-width: 96vw; max-height: 94vh; display: flex; flex-direction: column; align-items: center; gap: 0.6rem; }
    .lightbox-inner img { max-width: 100%; max-height: 82vh; border-radius: 10px; background: white; }
    .lightbox-cap { color: white; font-size: 0.85rem; text-align: center; }
    .lightbox-cap a { color: #fbcfe8; }
    .lightbox-close {
      position: absolute; top: -12px; right: -12px; width: 32px; height: 32px; border-radius: 50%;
      border: none; background: white; color: #111827; font-size: 1rem; cursor: pointer; box-shadow: 0 2px 8px rgb(0 0 0 / 0.3);
    }

    /* Celebration: confetti + toast on approval / level-up */
    .confetti-piece {
      position: fixed; top: -12px; width: 9px; height: 9px; z-index: 9999;
      pointer-events: none; opacity: 0.9;
      animation-name: confetti-fall; animation-timing-function: ease-in; animation-fill-mode: forwards;
    }
    @keyframes confetti-fall {
      to { transform: translateY(100vh) rotate(600deg); opacity: 0.2; }
    }
    .celebrate-toast {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%) translateY(-20px);
      background: linear-gradient(135deg, #B74094, #8f3175); color: white;
      padding: 0.85rem 1.4rem; border-radius: 100px; font-weight: 700; font-size: 0.95rem;
      box-shadow: 0 12px 30px -8px rgb(183 64 148 / 0.5); z-index: 10000;
      opacity: 0; transition: opacity 0.25s ease, transform 0.25s ease; white-space: nowrap;
    }
    .celebrate-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <header>
    <h1>Cindrebay AI Campus</h1>
    <button id="logoutBtn">Log out</button>
  </header>

  <main>
    <div id="announceBanner" class="announce hidden" role="status">
      <span aria-hidden="true">📢</span>
      <span id="announceText" class="announce-text"></span>
      <button type="button" id="announceClose" class="announce-close" aria-label="Dismiss announcement">✕</button>
    </div>

    <div id="timerBanner" class="timer-banner hidden">
      <span id="timerLabel"></span>
      <strong id="timerCountdown">--:--</strong>
    </div>

    <div class="profile-card">
      <div class="avatar" id="avatarInitial">?</div>
      <div class="profile-info">
        <h2 id="studentName">Loading…</h2>
        <span class="tier-badge" id="tierBadge">—</span>
        <span class="rank-badge" id="rankBadge"></span>
        <span class="streak-badge hidden" id="streakBadge"></span>
        <div class="xp-wrap" id="xpWrap">
          <div class="xp-row"><span id="xpLabel">0 XP</span><span id="nextTierLabel"></span></div>
          <div class="xp-bar" id="xpBar"><div class="xp-fill" id="xpFill" style="width:0%"></div></div>
        </div>
      </div>
    </div>

    <section>
      <h3>Your Badges</h3>
      <div class="badge-grid" id="badgeGrid"><p class="empty">Loading badges…</p></div>
    </section>

    <div class="tabs">
      <button class="tab active" data-tab="quests">Quests</button>
      <button class="tab" data-tab="mywork">My Work</button>
      <button class="tab" data-tab="gallery">Class Gallery</button>
      <button class="tab" data-tab="prompts">Prompt Library</button>
    </div>

    <section id="tab-quests">
      <h3>Active Quests</h3>
      <div class="quest-grid" id="questGrid">
        <p class="empty">Loading quests…</p>
      </div>
    </section>

    <section id="tab-mywork" class="hidden">
      <h3>My Work</h3>
      <div class="mywork-summary" id="myWorkSummary"></div>
      <button type="button" class="portfolio-btn" id="portfolioBtn" disabled>⬇ Download my portfolio</button>
      <div id="myWorkList"><p class="empty">Loading your submissions…</p></div>
    </section>

    <section id="tab-gallery" class="hidden">
      <h3>Class Gallery — Approved Work</h3>
      <div class="gallery-filter hidden" id="galleryFilter">
        <label for="galleryQuest">Show work from</label>
        <select id="galleryQuest"><option value="">All quests</option></select>
      </div>
      <div class="gallery-grid" id="galleryGrid"><p class="empty">Loading gallery…</p></div>
    </section>

    <section id="tab-prompts" class="hidden">
      <h3>Prompt Library</h3>
      <input type="text" id="promptSearch" class="prompt-search" placeholder="Search prompts by title, tool or category…">
      <div class="cat-chips">
        <button type="button" class="cat-chip" id="favToggle" aria-pressed="false">★ Saved only</button>
      </div>
      <div class="cat-chips hidden" id="promptCats"></div>
      <div class="prompt-list" id="promptList"><p class="empty">Loading prompts…</p></div>
    </section>

    <div class="submit-panel hidden" id="submitPanel">
      <label id="submitLabel">Submit your work</label>
      <textarea id="submissionText" placeholder="Paste your render link, Canva URL, or describe your work..."></textarea>
      <label for="submissionFile" class="file-label">Attach a file (optional) — PDF, PNG or JPEG, up to 20MB</label>
      <input type="file" id="submissionFile" accept=".pdf,.png,.jpg,.jpeg,image/png,image/jpeg,application/pdf">
      <div id="fileChosenName" class="file-chosen"></div>
      <button id="submitQuestBtn">Submit Quest</button>
      <div id="submitMsg"></div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://qoipjrrvouchxvcdrpbj.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFvaXBqcnJ2b3VjaHh2Y2RycGJqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2NjUwNTcsImV4cCI6MjEwNTI0MTA1N30.kMnLYLLwnEXdRDEy1uIzYSaA9I_w4SvmrXL83_Fhggw';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Escapes text for both element content and quoted attribute values.
    // Everything that comes from the database (names, titles, notes) goes through this before innerHTML.
    function escapeHtml(str) {
      return String(str ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function storageUrl(path) {
      return `${SUPABASE_URL}/storage/v1/object/public/submissions/${encodeURIComponent(path)}`;
    }

    // Returns the URL only if it is http(s); blocks javascript:, data:, etc.
    function safeUrl(str) {
      try {
        const u = new URL(String(str ?? '').trim());
        return u.protocol === 'http:' || u.protocol === 'https:' ? u.href : '';
      } catch (e) { return ''; }
    }

    // Quest id -> title for every quest (including inactive ones), fetched once per page load.
    let __questTitles = null;
    async function getQuestTitles() {
      if (__questTitles) return __questTitles;
      try {
        const { data, error } = await sb.from('quests').select('quest_id, title');
        if (error || !data) return {};
        const map = {};
        data.forEach(q => { map[q.quest_id] = q.title; });
        __questTitles = map;
        return map;
      } catch (e) {
        return {}; // never let a title lookup break the page; callers fall back to the quest id
      }
    }

    const session = JSON.parse(localStorage.getItem('cindrebay_student') || 'null');
    if (!session) window.location.href = 'index.html';

    let selectedQuestId = null;
    let myApprovedQuestIds = new Set();
    let __firstLoad = true;
    let __prevTier = null;
    let __prevTotalXp = null;

    function showXpGain(amount) {
      const wrap = document.getElementById('xpWrap');
      const bar = document.getElementById('xpBar');
      const label = document.createElement('div');
      label.className = 'xp-float';
      label.textContent = `+${amount} XP`;
      wrap.appendChild(label);
      setTimeout(() => label.remove(), 1500);

      bar.classList.remove('pulse');
      void bar.offsetWidth; // restart animation if it's already mid-pulse
      bar.classList.add('pulse');
    }
    let __prevSubStatus = {};
    let __prevBadgeIds = null;

    let __audioCtx = null;
    function playDing() {
      try {
        if (!__audioCtx) __audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const ctx = __audioCtx;
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type = 'sine';
        o.frequency.setValueAtTime(880, ctx.currentTime);
        o.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.12);
        g.gain.setValueAtTime(0.0001, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.5);
        o.start();
        o.stop(ctx.currentTime + 0.5);
      } catch (e) { /* audio not available, fail silently */ }
    }

    function celebrate(message) {
      playDing();
      const toast = document.createElement('div');
      toast.className = 'celebrate-toast';
      toast.textContent = message;
      document.body.appendChild(toast);
      requestAnimationFrame(() => toast.classList.add('show'));
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
      }, 3200);

      const colors = ['#B74094', '#8f3175', '#A6A970', '#ca8a04', '#16a34a'];
      for (let i = 0; i < 60; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.left = Math.random() * 100 + 'vw';
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.borderRadius = Math.random() < 0.5 ? '50%' : '2px';
        piece.style.animationDuration = (2 + Math.random() * 1.3) + 's';
        piece.style.animationDelay = (Math.random() * 0.3) + 's';
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 4000);
      }
    }

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('cindrebay_student');
      window.location.href = 'index.html';
    });

    function tierNextThreshold(xp) {
      if (xp < 100) return 100;
      if (xp < 500) return 500;
      return null;
    }

    async function loadProfile() {
      const { data, error } = await sb
        .from('students_directory')
        .select('*')
        .eq('student_id', session.student_id)
        .single();

      if (error || !data) {
        console.error(error);
        return;
      }

      document.getElementById('studentName').textContent = data.name;
      document.getElementById('avatarInitial').textContent = data.name.charAt(0).toUpperCase();
      document.getElementById('tierBadge').textContent = data.tier_level;
      document.getElementById('xpLabel').textContent = `${data.total_xp} XP`;

      if (!__firstLoad && __prevTotalXp !== null && data.total_xp > __prevTotalXp) {
        showXpGain(data.total_xp - __prevTotalXp);
      }
      __prevTotalXp = data.total_xp;

      const streakBadge = document.getElementById('streakBadge');
      if (data.streak_count >= 1) {
        streakBadge.textContent = `🔥 ${data.streak_count}-day streak`;
        streakBadge.classList.remove('hidden');
      } else {
        streakBadge.classList.add('hidden');
      }

      if (!__firstLoad && __prevTier !== null && data.tier_level !== __prevTier) {
        celebrate(`🎉 Leveled up to ${data.tier_level}!`);
      }
      __prevTier = data.tier_level;

      const next = tierNextThreshold(data.total_xp);
      document.getElementById('nextTierLabel').textContent = next ? `${next} XP to next tier` : 'Max tier reached';
      const pct = next ? Math.min(100, (data.total_xp / next) * 100) : 100;
      document.getElementById('xpFill').style.width = pct + '%';

      // Compute leaderboard rank among active, approved students
      const { data: allStudents } = await sb
        .from('students_directory')
        .select('student_id, total_xp')
        .order('total_xp', { ascending: false });

      if (allStudents && allStudents.length > 0) {
        const rank = allStudents.findIndex(s => s.student_id === session.student_id) + 1;
        if (rank > 0) {
          document.getElementById('rankBadge').textContent = `#${rank} of ${allStudents.length}`;
        }
      }
    }

    async function loadQuestsAndSubmissions() {
      const [{ data: quests, error: qErr }, { data: mySubs, error: sErr }] = await Promise.all([
        sb.from('quests').select('*').eq('status', 'Active').order('quest_id'),
        sb.rpc('get_my_submissions', { p_student_id: session.student_id, p_pin: session.pin }),
      ]);

      if (qErr) console.error(qErr);
      if (sErr) console.error(sErr);

      const grid = document.getElementById('questGrid');

      if (!quests || quests.length === 0) {
        grid.innerHTML = '<p class="empty">No quests active yet — your teacher will activate them as the class progresses.</p>';
        return;
      }

      // One card per quest: show the latest attempt, but never let a later attempt hide an approval.
      const subsByQuest = {};
      [...(mySubs || [])].sort((a, b) => a.submission_id - b.submission_id).forEach(s => {
        const cur = subsByQuest[s.quest_id];
        if (!cur || cur.status !== 'Approved') subsByQuest[s.quest_id] = s;
      });
      myApprovedQuestIds = new Set((mySubs || []).filter(s => s.status === 'Approved').map(s => s.quest_id));

      if (!__firstLoad) {
        (mySubs || []).forEach(s => {
          if (s.status === 'Approved' && __prevSubStatus[s.quest_id] !== 'Approved') {
            const questTitle = (quests.find(q => q.quest_id === s.quest_id) || {}).title || s.quest_id;
            celebrate(`🎉 ${questTitle} approved! +${s.xp_awarded} XP`);
          }
        });
      }
      const nextSubStatus = {};
      (mySubs || []).forEach(s => { nextSubStatus[s.quest_id] = s.status; });
      __prevSubStatus = nextSubStatus;

      grid.innerHTML = quests.map(q => {
        const mySub = subsByQuest[q.quest_id];
        let statusHtml = '';
        if (mySub) {
          if (mySub.status === 'Approved') statusHtml = `<div class="my-status status-approved">✓ Approved · +${Number(mySub.xp_awarded) || 0} XP</div>`;
          else if (mySub.status === 'Pending Review') statusHtml = `<div class="my-status status-pending">⏳ Pending review</div>`;
          else statusHtml = `<div class="my-status status-iteration">↻ Needs another try</div>`;
          if (mySub.status !== 'Pending Review' && mySub.feedback_note) {
            statusHtml += `<div class="my-feedback">💬 ${escapeHtml(mySub.feedback_note)}</div>`;
          }
        }
        return `
          <div class="quest" data-quest-id="${escapeHtml(q.quest_id)}" data-quest-title="${escapeHtml(q.title)}">
            <div class="quest-top">
              <h4>${escapeHtml(q.title)}</h4>
              <span class="xp-pill">+${Number(q.points_xp) || 0} XP</span>
            </div>
            <div class="tool">${escapeHtml(q.required_tool || '')}</div>
            ${statusHtml}
          </div>
        `;
      }).join('');

      grid.querySelectorAll('.quest').forEach(el => {
        el.addEventListener('click', () => selectQuest(el.dataset.questId, el.dataset.questTitle));
      });
    }

    function selectQuest(questId, questTitle) {
      selectedQuestId = questId;
      document.querySelectorAll('.quest').forEach(el => {
        el.classList.toggle('selected', el.dataset.questId === questId);
      });
      document.getElementById('submitLabel').textContent = `Submit: ${questTitle}`;
      document.getElementById('submitPanel').classList.remove('hidden');
      document.getElementById('submitMsg').textContent = '';
      document.getElementById('submissionText').value = '';
      document.getElementById('submissionFile').value = '';
      document.getElementById('fileChosenName').textContent = '';
      document.getElementById('submitPanel').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    document.getElementById('submissionFile').addEventListener('change', (e) => {
      const f = e.target.files[0];
      document.getElementById('fileChosenName').textContent = f ? `Selected: ${f.name} (${(f.size / 1024 / 1024).toFixed(1)} MB)` : '';
    });

    document.getElementById('submitQuestBtn').addEventListener('click', async () => {
      const text = document.getElementById('submissionText').value.trim();
      const fileInput = document.getElementById('submissionFile');
      const file = fileInput.files[0];
      const msg = document.getElementById('submitMsg');
      const btn = document.getElementById('submitQuestBtn');

      if (!selectedQuestId) return;
      if (!text && !file) {
        msg.style.color = '#dc2626';
        msg.textContent = 'Please paste a link, describe your work, or attach a file.';
        return;
      }

      const allowedTypes = ['image/png', 'image/jpeg', 'application/pdf'];
      if (file && !allowedTypes.includes(file.type)) {
        msg.style.color = '#dc2626';
        msg.textContent = 'Only PDF, PNG, or JPEG files are allowed.';
        return;
      }
      if (file && file.size > 20 * 1024 * 1024) {
        msg.style.color = '#dc2626';
        msg.textContent = 'File is too large — 20MB maximum.';
        return;
      }

      btn.disabled = true;
      btn.textContent = file ? 'Uploading...' : 'Submitting...';

      let filePath = null;
      let fileType = null;

      if (file) {
        const ext = file.name.split('.').pop();
        const randomName = `${session.student_id}_${selectedQuestId}_${Date.now()}_${Math.random().toString(36).slice(2, 8)}.${ext}`;
        const { error: uploadError } = await sb.storage.from('submissions').upload(randomName, file);

        if (uploadError) {
          btn.disabled = false;
          btn.textContent = 'Submit Quest';
          msg.style.color = '#dc2626';
          msg.textContent = 'File upload failed. Please try again.';
          console.error(uploadError);
          return;
        }

        filePath = randomName;
        fileType = file.type === 'application/pdf' ? 'pdf' : 'image';
      }

      btn.textContent = 'Submitting...';

      const { error } = await sb.rpc('submit_quest', {
        p_student_id: session.student_id,
        p_pin: session.pin,
        p_quest_id: selectedQuestId,
        p_image_or_link: text,
        p_file_path: filePath,
        p_file_type: fileType,
      });

      btn.disabled = false;
      btn.textContent = 'Submit Quest';

      if (error) {
        msg.style.color = '#dc2626';
        msg.textContent = 'Submission failed. Please try again.';
        console.error(error);
        return;
      }

      msg.style.color = '#16a34a';
      msg.textContent = 'Submitted! Your teacher will review it shortly.';
      document.getElementById('submissionText').value = '';
      document.getElementById('submissionFile').value = '';
      document.getElementById('fileChosenName').textContent = '';
      loadQuestsAndSubmissions();
    });

    // ---------- Tabs ----------
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        ['quests', 'mywork', 'gallery', 'prompts'].forEach(name => {
          document.getElementById('tab-' + name).classList.toggle('hidden', name !== tab.dataset.tab);
        });
        if (tab.dataset.tab === 'mywork') loadMyWork();
        if (tab.dataset.tab === 'gallery') loadGallery();
        if (tab.dataset.tab === 'prompts') loadPrompts();
      });
    });

    // ---------- Portfolio: the student's approved work as a standalone page they can keep or print ----------
    let __portfolio = { approved: [], titles: {} };

    document.getElementById('portfolioBtn').addEventListener('click', () => {
      const { approved, titles } = __portfolio;
      if (!approved.length) return;

      const name = (session && session.name) || document.getElementById('studentName').textContent || 'Student';
      const tier = document.getElementById('tierBadge').textContent;

      const cards = [...approved].sort((a, b) => a.submission_id - b.submission_id).map(s => {

          visual = s.file_type === 'image'

        } else if (s.image_or_link) {

          visual = link

              <div class="sub">+${Number(s.xp_awarded) || 0} XP${when ? ' · ' + escapeHtml(when) : ''}</div>
              ${s.feedback_note ? `<div class="note">“${escapeHtml(s.feedback_note)}”</div>` : ''}
            </div>
          </div>`;
      }).join('');

      const page = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${escapeHtml(name)} — Cindrebay AI Campus Portfolio</title>
<style>
  body { font-family: -apple-system, 'Inter', sans-serif; background: #fbeef7; margin: 0; padding: 2rem 1.25rem; color: #424143; }

  p.sub { text-align: center; color: #6b7280; margin: 0 0 2rem; }

  .meta { padding: 0.75rem 0.9rem; }

  @media print { body { background: white; } }
</style>
</head>
<body>
  <h1>${escapeHtml(name)}</h1>
  <p class="sub">Cindrebay AI Campus · ${escapeHtml(tier)} · ${approved.length} approved piece${approved.length === 1 ? '' : 's'} · ${xp} XP from quests · saved ${new Date().toLocaleDateString()}</p>
  <div class="grid">${cards}</div>

      const url = URL.createObjectURL(new Blob([page], { type: 'text/html' }));
      const a = document.createElement('a');
      a.href = url;
      a.download = `my-cindrebay-portfolio-${new Date().toISOString().slice(0, 10)}.html`;

    // ---------- My Work (the student's own submission history) ----------
    async function loadMyWork() {
      const list = document.getElementById('myWorkList');
      const summary = document.getElementById('myWorkSummary');

      const [{ data: subs, error }, titles] = await Promise.all([
        sb.rpc('get_my_submissions', { p_student_id: session.student_id, p_pin: session.pin }),
        getQuestTitles(),
      ]);

      const portfolioBtn = document.getElementById('portfolioBtn');
      __portfolio = { approved: [], titles: {} };
      portfolioBtn.disabled = true;

      if (error) {
        console.error(error);
        summary.textContent = '';
        list.innerHTML = '<p class="empty">Could not load your submissions. Please try again.</p>';
        return;
      }

      const mine = [...(subs || [])].sort((a, b) => b.submission_id - a.submission_id);
      if (mine.length === 0) {
        summary.textContent = '';
        list.innerHTML = '<p class="empty">You have not submitted anything yet — pick a quest to get started!</p>';
        return;
      }

      const approved = mine.filter(s => s.status === 'Approved');
      __portfolio = { approved, titles };
      portfolioBtn.disabled = approved.length === 0;
      const pending = mine.filter(s => s.status === 'Pending Review').length;
      const xp = approved.reduce((sum, s) => sum + (Number(s.xp_awarded) || 0), 0);
      summary.textContent = `${approved.length} approved · ${pending} pending · ${xp} XP from quests`;

      list.innerHTML = mine.map(s => {
        let status;
        if (s.status === 'Approved') status = `<span class="my-status status-approved">✓ Approved · +${Number(s.xp_awarded) || 0} XP</span>`;
        else if (s.status === 'Pending Review') status = '<span class="my-status status-pending">⏳ Pending review</span>';
        else status = '<span class="my-status status-iteration">↻ Needs another try</span>';

        let text = '';
        if (s.image_or_link) {
          const link = safeUrl(s.image_or_link);
          const shown = escapeHtml(s.image_or_link.slice(0, 120));
          text = link
            ? `<div class="work-text"><a href="${escapeHtml(link)}" target="_blank" rel="noopener noreferrer">${shown}</a></div>`
            : `<div class="work-text">${shown}</div>`;
        }

        let file = '';
        if (s.file_path) {
          const url = escapeHtml(storageUrl(s.file_path));
          file = s.file_type === 'image'
            ? `<a href="${url}" target="_blank" rel="noopener noreferrer"><img class="work-thumb" src="${url}" alt="Your submitted work"></a>`
            : `<div class="work-text"><a href="${url}" target="_blank" rel="noopener noreferrer">📄 View your PDF</a></div>`;
        }

        const note = s.feedback_note && s.status !== 'Pending Review'
          ? `<div class="my-feedback">💬 ${escapeHtml(s.feedback_note)}</div>` : '';

        return `
          <div class="work-card">
            <div class="work-top">
              <h4>${escapeHtml(titles[s.quest_id] || s.quest_id)}</h4>
              ${status}
            </div>
            ${text}
            ${file}
            ${note}
          </div>
        `;
      }).join('');
    }

    // ---------- Badges ----------
    async function loadBadges() {
      const [{ data: allBadges }, { data: mine }, titles] = await Promise.all([
        sb.from('badges').select('*').order('sort_order'),
        sb.from('student_badges').select('badge_id').eq('student_id', session.student_id),
        getQuestTitles(),
      ]);

      const grid = document.getElementById('badgeGrid');

          if (!__prevBadgeIds.has(badgeId)) {
            const badge = allBadges.find(b => b.badge_id === badgeId);
            celebrate(`🏅 New badge: ${badge ? badge.title : badgeId}!`);
          }
        });
      }
      __prevBadgeIds = earned;

          ${!earned.has(b.badge_id) && b.unlock_quest_id ? `<div class="hint">🔒 ${escapeHtml(titles[b.unlock_quest_id] || b.unlock_quest_id)}</div>` : ''}
        </div>
      `).join('');

    // ---------- Class gallery ----------
    async function loadGallery() {
      const [{ data: subs }, { data: names }] = await Promise.all([
        sb.from('submissions')
          .select('*, quests(title)')
          .eq('status', 'Approved')
          .not('file_path', 'is', null)
          .order('submission_id', { ascending: false })
          .limit(30),
        sb.from('students_directory').select('student_id, name'),
      ]);

      const nameById = {};
      (names || []).forEach(n => { nameById[n.student_id] = n.name; });

      __galleryItems = (subs || []).map(s => ({
        s,
        who: nameById[s.student_id] || 'Student',
        what: s.quests?.title || s.quest_id,
      }));

      // Quest filter: only quests that actually have work in the gallery; keep the current choice if still valid.
      const select = document.getElementById('galleryQuest');
      const previous = select.value;
      const quests = new Map();
      __galleryItems.forEach(i => quests.set(i.s.quest_id, i.what));
      select.innerHTML = '<option value="">All quests</option>' +
        [...quests].map(([id, title]) => `<option value="${escapeHtml(id)}">${escapeHtml(title)}</option>`).join('');
      select.value = quests.has(previous) ? previous : '';
      document.getElementById('galleryFilter').classList.toggle('hidden', quests.size < 2);

      renderGallery();
    }

    let __galleryItems = [];

    function renderGallery() {
      const grid = document.getElementById('galleryGrid');
      const filter = document.getElementById('galleryQuest').value;
      const items = filter ? __galleryItems.filter(i => i.s.quest_id === filter) : __galleryItems;

      if (items.length === 0) {
        grid.innerHTML = '<p class="empty">No approved work with files yet — be the first!</p>';
        return;
      }

      grid.innerHTML = items.map(({ s, who, what }) => {
        const url = escapeHtml(storageUrl(s.file_path));
        const visual = s.file_type === 'image'
          ? `<a href="${url}" target="_blank" rel="noopener noreferrer" class="lightbox-link" data-caption="${escapeHtml(who + ' — ' + what)}"><img src="${url}" alt="Approved work"></a>`
          : `<a href="${url}" target="_blank" rel="noopener noreferrer" class="pdf-tile">📄</a>`;
        return `
          <div class="gallery-card">
            ${visual}
            <div class="meta">
              <div class="who">${escapeHtml(who)}</div>
              <div class="what">${escapeHtml(what)}</div>
            </div>
          </div>
        `;
      }).join('');

      // Clicking an image opens it larger in place; modified clicks (new tab etc.) keep the normal link behaviour.
      grid.querySelectorAll('a.lightbox-link').forEach(a => {
        a.addEventListener('click', (e) => {
          if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return;
          e.preventDefault();
          openLightbox(a.href, a.dataset.caption || '');
        });
      });
    }

    document.getElementById('galleryQuest').addEventListener('change', renderGallery);

    function closeLightbox() {
      const ov = document.getElementById('lightbox');
      if (ov) ov.remove();
    }

    function openLightbox(url, caption) {
      closeLightbox();
      const ov = document.createElement('div');
      ov.id = 'lightbox';
      ov.className = 'lightbox';
      ov.setAttribute('role', 'dialog');
      ov.setAttribute('aria-label', 'Enlarged work');
      ov.innerHTML = `
        <div class="lightbox-inner">
          <button type="button" class="lightbox-close" aria-label="Close">✕</button>
          <img src="${escapeHtml(url)}" alt="${escapeHtml(caption)}">
          <div class="lightbox-cap">${escapeHtml(caption)} · <a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">Open original</a></div>
        </div>`;
      ov.addEventListener('click', (e) => {
        if (e.target === ov || e.target.classList.contains('lightbox-close')) closeLightbox();
      });
      document.body.appendChild(ov);
    }

    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });

    // ---------- Prompt library ----------
    let __allPrompts = [];
    let __promptCategory = ''; // '' = all categories
    async function loadPrompts() {
      if (__allPrompts.length === 0) {
        const { data } = await sb.from('prompts').select('*').order('sort_order');
        __allPrompts = data || [];
        renderPromptCats();
      }
      renderPrompts();
    }

    function renderPromptCats() {
      const box = document.getElementById('promptCats');
      const cats = [...new Set(__allPrompts.map(p => p.category).filter(Boolean))].sort();
      if (cats.length < 2) { box.classList.add('hidden'); return; }
      box.classList.remove('hidden');
      box.innerHTML = [['', 'All'], ...cats.map(c => [c, c])].map(([value, label]) =>
        `<button type="button" class="cat-chip ${value === __promptCategory ? 'active' : ''}" data-cat="${escapeHtml(value)}">${escapeHtml(label)}</button>`
      ).join('');
      box.querySelectorAll('.cat-chip').forEach(btn => {
        btn.addEventListener('click', () => {
          __promptCategory = btn.dataset.cat;
          renderPromptCats();
          renderPrompts();
        });
      });
    }

    // Saved prompts live in this browser only (per student); storage can be unavailable, so it is always guarded.
    const FAV_KEY = 'cindrebay_fav_prompts_' + (session ? session.student_id : 'anon');
    let __favPromptIds = new Set();
    try {
      const saved = JSON.parse(localStorage.getItem(FAV_KEY) || '[]');
      if (Array.isArray(saved)) __favPromptIds = new Set(saved.map(Number));
    } catch (e) { /* no saved prompts */ }
    let __favOnly = false;

    function saveFavs() {
      try { localStorage.setItem(FAV_KEY, JSON.stringify([...__favPromptIds])); } catch (e) { /* storage unavailable */ }
    }

    document.getElementById('favToggle').addEventListener('click', () => {
      __favOnly = !__favOnly;
      const btn = document.getElementById('favToggle');
      btn.classList.toggle('active', __favOnly);
      btn.setAttribute('aria-pressed', String(__favOnly));
      renderPrompts();
    });

    function renderPrompts() {
      const q = (document.getElementById('promptSearch').value || '').toLowerCase().trim();
      let pool = __promptCategory ? __allPrompts.filter(p => p.category === __promptCategory) : __allPrompts;
      if (__favOnly) pool = pool.filter(p => __favPromptIds.has(Number(p.prompt_id)));
      const list = q
        ? pool.filter(p =>
            (p.title || '').toLowerCase().includes(q) ||
            (p.category || '').toLowerCase().includes(q) ||
            (p.tool || '').toLowerCase().includes(q) ||
            (p.prompt_text || '').toLowerCase().includes(q))
        : pool;

      const el = document.getElementById('promptList');
      if (list.length === 0) {
        el.innerHTML = __favOnly && !q
          ? '<p class="empty">No saved prompts here yet — tap ☆ Save on a prompt to keep it.</p>'
          : '<p class="empty">No prompts match your search.</p>';
        return;
      }

      el.innerHTML = list.map(p => `
        <div class="prompt-card">
          <div class="top">
            <h4>${escapeHtml(p.title)}</h4>
            <span class="tool-tag">${escapeHtml(p.tool || p.category)}</span>
          </div>
          <pre id="prompt-${Number(p.prompt_id)}">${escapeHtml(p.prompt_text)}</pre>
          ${p.notes ? `<div class="notes">${escapeHtml(p.notes)}</div>` : ''}
          <button class="copy-btn" data-copy="${Number(p.prompt_id)}">Copy prompt</button>
          <button class="copy-btn fav-btn ${__favPromptIds.has(Number(p.prompt_id)) ? 'on' : ''}" data-fav="${Number(p.prompt_id)}" aria-pressed="${__favPromptIds.has(Number(p.prompt_id))}">${__favPromptIds.has(Number(p.prompt_id)) ? '★ Saved' : '☆ Save'}</button>
        </div>
      `).join('');

      el.querySelectorAll('button[data-fav]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = Number(btn.dataset.fav);
          if (__favPromptIds.has(id)) __favPromptIds.delete(id); else __favPromptIds.add(id);
          saveFavs();
          renderPrompts();
        });
      });

      el.querySelectorAll('button[data-copy]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const text = document.getElementById('prompt-' + btn.dataset.copy).textContent;
          try { await navigator.clipboard.writeText(text); } catch (e) { /* clipboard blocked */ }
          btn.textContent = 'Copied!';
          btn.classList.add('copied');
          setTimeout(() => { btn.textContent = 'Copy prompt'; btn.classList.remove('copied'); }, 1500);
        });
      });
    }

    document.getElementById('promptSearch').addEventListener('input', renderPrompts);

    // ---------- Timer ----------
    let __timerEnds = null;
    async function syncTimer() {
      const { data } = await sb.rpc('get_timer');
      const row = data && data[0];
      __timerEnds = row && row.ends_at ? new Date(row.ends_at) : null;
      document.getElementById('timerLabel').textContent = row ? (row.label || 'Time remaining') : '';
    }

    function tickTimer() {
      const banner = document.getElementById('timerBanner');
      if (!__timerEnds) { banner.classList.add('hidden'); return; }
      const secs = Math.floor((__timerEnds - new Date()) / 1000);
      if (secs <= 0) { banner.classList.add('hidden'); return; }
      banner.classList.remove('hidden');
      banner.classList.toggle('urgent', secs <= 60);
      const m = String(Math.floor(secs / 60)).padStart(2, '0');
      const s = String(secs % 60).padStart(2, '0');
      document.getElementById('timerCountdown').textContent = `${m}:${s}`;
    }

    // ---------- Teacher announcement ----------
    // A student can dismiss it; it comes back when the teacher changes the text. Storage is guarded.
    const ANNOUNCE_KEY = 'cindrebay_announce_dismissed_' + (session ? session.student_id : 'anon');
    let __announceMessage = '';

    function announceDismissed() {
      try { return localStorage.getItem(ANNOUNCE_KEY) === __announceMessage; } catch (e) { return false; }
    }

    function renderAnnouncement() {
      const banner = document.getElementById('announceBanner');
      if (!__announceMessage || announceDismissed()) { banner.classList.add('hidden'); return; }
      document.getElementById('announceText').textContent = __announceMessage;
      banner.classList.remove('hidden');
    }

    async function syncAnnouncement() {
      try {
        const { data, error } = await sb.rpc('get_announcement');
        if (error) return; // keep whatever is showing
        __announceMessage = data && data[0] && data[0].message ? String(data[0].message) : '';
        renderAnnouncement();
      } catch (e) { /* announcements are optional: never let them break the dashboard */ }
    }

    document.getElementById('announceClose').addEventListener('click', () => {
      try { localStorage.setItem(ANNOUNCE_KEY, __announceMessage); } catch (e) { /* storage unavailable */ }
      renderAnnouncement();
    });

    async function refreshAll() {
      await Promise.all([loadProfile(), loadQuestsAndSubmissions(), loadBadges(), syncTimer(), syncAnnouncement()]);
      __firstLoad = false;
    }

    refreshAll();
    setInterval(refreshAll, 15000); // keep XP/quest status fresh during class
    setInterval(tickTimer, 1000);
  </script>
</body>
</html>
